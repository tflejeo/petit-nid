      const lot = (activeV2List().lots || []).find(l => l.id === btn.dataset.v2Lot);
      if(lot){
        lot.entries = lot.entries.filter(e => e.id !== btn.dataset.v2DelEntry);
        if(lot.entries.length === 0){
          (lot.photos || []).forEach(deletePhotoRef);
          activeV2List().lots = activeV2List().lots.filter(l => l.id !== lot.id);
        }
      }
      save(); closeModal(); render(); showToast('Article supprimé');
    });
  });

  if(v2UsesSimpleFlow(activeV2List())){
    const addSizeBtn = document.getElementById('btnCatalogAddSize');
    if(addSizeBtn) addSizeBtn.onclick = () => {
      const list = activeV2List();
      openModal(`
        <h2>Nouvelle ${list.sizeLabel.toLowerCase()}</h2>
        <div class="field"><label class="field-label">Nom</label><input type="text" id="newCatalogSizeName" placeholder="ex. Transport"></div>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="mCancel">Annuler</button>
          <button class="btn btn-primary" id="mSave">Créer</button>
        </div>
      `);
      document.getElementById('mCancel').onclick = closeModal;
      document.getElementById('mSave').onclick = () => {
        const label = document.getElementById('newCatalogSizeName').value.trim();
        if(!label){ showToast('Donnez un nom'); return; }
        if(!Array.isArray(list.sizes)) list.sizes = [];
        const newSize = { id:newId(), label };
        list.sizes.push(newSize);
        ui.collapsedSections['v2-' + newSize.id] = false;
        save(); saveUi(); closeModal(); render(); showToast(list.sizeLabel + ' créée');
      };
    };
    document.querySelectorAll('[data-v2-catalog-add]').forEach(btn => {
      btn.onclick = () => {
        const [sizeId, categoryId] = btn.dataset.v2CatalogAdd.split('::');
        openCatalogEntryModal(sizeId, categoryId, null);
      };
    });
    document.querySelectorAll('[data-v2-catalog-newcat]').forEach(row => {
      const sizeId = row.dataset.v2CatalogNewcat;
      row.querySelector('.v2-quickadd-btn').onclick = () => {
        const input = row.querySelector('.v2-quickadd-newcat-input');
        const targetInput = row.querySelector('.v2-quickadd-target');
        const label = input.value.trim();
        if(!label){ showToast('Donnez un nom à l’article'); return; }
        const val = clamp(parseInt(targetInput.value, 10) || 0, 0, 999);
        const list = activeV2List();
        if(!Array.isArray(list.categories)) list.categories = [];
        let cat = list.categories.find(c => c.label.trim().toLowerCase() === label.toLowerCase());
        if(!cat){ cat = { id:newId(), label }; list.categories.push(cat); }
        if(!Array.isArray(list.targets)) list.targets = [];
        let t = list.targets.find(t => t.sizeId === sizeId && t.categoryId === cat.id && !t.charId);
        if(t) t.target = val;
        else list.targets.push({ sizeId, categoryId: cat.id, target: val });
        save(); render();
      };
    });
    document.querySelectorAll('[data-v2-entry-row]').forEach(row => {
      row.classList.add('unit-row-clickable');
      row.addEventListener('click', (e) => {
        if(e.target.closest('[data-v2-del-entry]') || e.target.closest('[data-v2-zoom-lot]')) return;
        const entryId = row.dataset.v2EntryRow;
        const lot = (activeV2List().lots || []).find(l => (l.entries || []).some(en => en.id === entryId));
        if(!lot) return;
        const entry = lot.entries.find(en => en.id === entryId);
        openCatalogEntryModal((entry.sizeIds || [])[0], entry.categoryId, { lot, entry });
      });
    });
    document.querySelectorAll('[data-v2-zoom-lot]').forEach(imgEl => {
      imgEl.onclick = () => {
        const lot = (activeV2List().lots || []).find(l => l.id === imgEl.dataset.v2ZoomLot);
        if(lot && lot.photos && lot.photos.length){
          const entry = (lot.entries || [])[0];
          Promise.all(lot.photos.map(getPhotoSrcAsync)).then(srcs => {
            openLightbox(srcs.map(src => ({
              src,
              gotoLabel: 'Modifier',
              onGoto: () => entry ? openCatalogEntryModal((entry.sizeIds || [])[0], entry.categoryId, { lot, entry }) : null
            })), 0);
          });
        }
      };
    });
  }
}

function openVetementModal(existingLot){
  const isNew = !existingLot;
  const list = activeV2List();
  let photos = isNew ? [] : (existingLot.photos || []).map(id => ({ id, src:null, hidden: (existingLot.hiddenPhotos || []).includes(id) }));
  let removedExistingPhotoIds = [];
  let lines = isNew
    ? [{ id:newId(), sizeIds: [], categoryId:'', brandId:'', qty:1, charValues:{}, expanded:true }]
    : (existingLot.entries || []).map(e => ({ id:e.id, sizeIds:(e.sizeIds || []).slice(), categoryId:e.categoryId, brandId:e.brandId || '', qty:e.qty, charValues: Object.assign({}, e.charValues), expanded:false }));

  function catOptions(selected){
    return `<option value="" ${selected ? '' : 'selected'}>Choisir : ${escapeHtml(list.categoryLabel)}…</option>` +
      v2SortByLabel(activeV2List().categories).map(c => `<option value="${c.id}" ${c.id===selected?'selected':''}>${escapeHtml(c.label)}</option>`).join('');
  }
  function brandOptions(selected){
    return `<option value="">Marque —</option>` + v2SortByLabel(activeV2List().brands).map(b => `<option value="${b.id}" ${b.id===selected?'selected':''}>${escapeHtml(b.label)}</option>`).join('');
  }
  function sizeChips(line){
    return (activeV2List().sizes || []).map(s => `<button type="button" class="chip-toggle ${line.sizeIds.includes(s.id) ? 'selected' : ''}" data-line-size="${line.id}" data-size-id="${s.id}">${escapeHtml(s.label)}</button>`).join('');
  }
  function charPickersHtml(line){
    const chars = v2CharacteristicsForCategory(line.categoryId);
    if(!chars.length) return '';
    return chars.map(ch => `
      <div style="margin-top:8px;">
        <div class="field-label" style="margin-bottom:4px;">${escapeHtml(ch.label)}</div>
        <div class="v2-size-chips">
          ${ch.values.map(v => `<button type="button" class="chip-toggle ${(line.charValues||{})[ch.id]===v.id ? 'selected' : ''}" data-line-char="${line.id}" data-char-id="${ch.id}" data-value-id="${v.id}">${escapeHtml(v.label)}</button>`).join('')}
        </div>
      </div>
    `).join('');
  }
  function lineSummary(l){
    const catLabel = l.categoryId ? v2CategoryLabel(l.categoryId) : `${list.categoryLabel} non choisi(e)`;
    const sizesLabel = l.sizeIds.length ? l.sizeIds.map(id => v2SizeLabel(id)).join(', ') : `${list.sizeLabel} non choisi(e)`;
    const brandLabel = l.brandId ? v2BrandLabel(l.brandId) : '';
    return `${catLabel} · ${sizesLabel}${brandLabel ? ' · ' + brandLabel : ''} · Qté ${l.qty}`;
  }
  function linesHtml(){
    return lines.map(l => `
      <div class="v2-line-card" data-line="${l.id}">
        <button type="button" class="v2-line-header" data-line-toggle="${l.id}">
          <span class="v2-line-summary">${escapeHtml(lineSummary(l))}</span>
          <span class="chev ${l.expanded ? 'open' : ''}">${icon('chevronDown','icon-sm')}</span>
        </button>
        <div class="v2-line-body" style="display:${l.expanded ? 'block' : 'none'};">
          <div class="field-label" style="margin-bottom:4px;">${escapeHtml(list.sizeLabel)}</div>
          <div class="v2-size-chips">${sizeChips(l)}</div>
          <div style="margin-top:8px;">
            <select data-line-field="categoryId" data-line="${l.id}" style="width:100%;">${catOptions(l.categoryId)}</select>
          </div>
          ${charPickersHtml(l)}
          <div style="display:flex; gap:8px; margin-top:6px;">
            <select data-line-field="brandId" data-line="${l.id}" style="flex:1; min-width:0;">${brandOptions(l.brandId)}</select>
            <input type="number" min="1" data-line-field="qty" data-line="${l.id}" value="${l.qty}" style="width:56px; text-align:center; flex-shrink:0;">
            ${lines.length > 1 ? `<button type="button" class="text-btn danger" data-del-line="${l.id}" style="flex-shrink:0;">${icon('x','icon-sm')}</button>` : ''}
          </div>
        </div>
      </div>
    `).join('');
  }
  let uploading = false;
  function photosHtml(){
    return `
      <div class="v2-photo-list">
        ${photos.map((p, i) => `
          <div class="v2-photo-row">
            <img ${p.src ? `src="${p.src}"` : `data-photo-src="${p.id}"`} class="v2-photo-thumb-lg" data-v2-modal-zoom="${i}">
            <div class="v2-photo-controls">
              <label class="v2-hide-check"><input type="checkbox" data-photo-hide="${i}" ${p.hidden ? 'checked' : ''}> Masquer sur la galerie photo</label>
              <button type="button" class="text-btn danger" data-del-new-photo="${i}">${icon('trash','icon-sm')} Retirer cette photo</button>
            </div>
          </div>
        `).join('')}
        <label class="photo-add-tile ${uploading ? 'uploading' : ''}" style="align-self:flex-start;">
          ${uploading ? '<span class="photo-add-spinner"></span>' : icon('camera','icon-sm')}
          <input type="file" accept="image/*" multiple id="newVetementPhotoInput" style="display:none;" ${uploading ? 'disabled' : ''}>
        </label>
      </div>
    `;
  }

  openModal(`
    <h2>${isNew ? 'Ajouter un article' : 'Modifier ce lot'}</h2>
    <div class="field">
      <label class="field-label">Photo(s) du lot</label>
      <div id="newVetementPhotos">${photosHtml()}</div>
    </div>
    <div class="field">
      <label class="field-label">Prix total du lot (€)</label>
      <input type="number" min="0" step="0.01" id="newVetementPrice" placeholder="0,00" value="${isNew ? '' : (existingLot.price || '')}">
    </div>
    <div class="field">
      <label class="field-label">Articles sur cette photo</label>
      <div id="newVetementLines" style="display:flex; flex-direction:column; gap:14px;">${linesHtml()}</div>
      <button type="button" class="add-row-btn" id="btnAddLine" style="margin-top:10px;">${icon('plus','icon-sm')} Ajouter un article sur cette photo</button>
    </div>
    <div class="modal-actions">
      ${!isNew ? `<button type="button" class="btn btn-danger" id="btnDeleteLot">${icon('trash','icon-sm')} Supprimer le lot</button>` : `<button class="btn btn-secondary" id="mCancel">Annuler</button>`}
      <button class="btn btn-primary" id="mSave">Enregistrer</button>
    </div>
  `);

  function bindPhotoEvents(){
    const container = document.getElementById('newVetementPhotos');
    container.innerHTML = photosHtml();
    hydratePhotoImages(container);
    const input = document.getElementById('newVetementPhotoInput');
    if(input) input.onchange = (e) => {
      const files = Array.from(e.target.files || []).filter(f => f.type && f.type.startsWith('image/'));
      e.target.value = '';
      if(!files.length) return;
      uploading = true;
      bindPhotoEvents();
      Promise.allSettled(files.map(compressImageFile)).then(results => {
        let added = 0;
        results.forEach(r => { if(r.status === 'fulfilled'){ photos.push({ id:null, src:r.value, hidden:false }); added++; } });
        uploading = false;
        bindPhotoEvents();
        showToast(added > 0 ? (added > 1 ? added + ' photos ajoutées' : 'Photo ajoutée') : 'Impossible de traiter cette photo.');
      });
    };
    container.querySelectorAll('[data-del-new-photo]').forEach(btn => {
      btn.onclick = () => {
        const removed = photos.splice(parseInt(btn.dataset.delNewPhoto, 10), 1)[0];
        if(removed && removed.id) removedExistingPhotoIds.push(removed.id);
        bindPhotoEvents();
      };
    });
    container.querySelectorAll('[data-photo-hide]').forEach(cb => {
      cb.onchange = () => { photos[parseInt(cb.dataset.photoHide, 10)].hidden = cb.checked; };
    });
    container.querySelectorAll('[data-v2-modal-zoom]').forEach(imgEl => {
      imgEl.onclick = () => {
        const zoomIdx = parseInt(imgEl.dataset.v2ModalZoom, 10);
        Promise.all(photos.map(p => p.src ? Promise.resolve(p.src) : getPhotoSrcAsync(p.id))).then(srcs => {
          openLightbox(srcs.map(src => ({ src })), zoomIdx);
        });
      };
    });
  }

  function bindLineEvents(){
    const container = document.getElementById('newVetementLines');
    container.innerHTML = linesHtml();
    container.querySelectorAll('[data-line-toggle]').forEach(btn => {
      btn.onclick = () => {
        const line = lines.find(l => l.id === btn.dataset.lineToggle);
        if(!line) return;
        line.expanded = !line.expanded;
        bindLineEvents();
      };
    });
    container.querySelectorAll('[data-line-field]').forEach(el => {
      el.onchange = () => {
        const line = lines.find(l => l.id === el.dataset.line);
        if(!line) return;
        const field = el.dataset.lineField;
        line[field] = field === 'qty' ? Math.max(1, parseInt(el.value, 10) || 1) : el.value;
        if(field === 'categoryId') bindLineEvents();
      };
    });
    container.querySelectorAll('[data-line-size]').forEach(btn => {
      btn.onclick = () => {
        const line = lines.find(l => l.id === btn.dataset.lineSize);
        if(!line) return;
        const sizeId = btn.dataset.sizeId;
        if(line.sizeIds.includes(sizeId)) line.sizeIds = line.sizeIds.filter(id => id !== sizeId);
        else line.sizeIds.push(sizeId);
        bindLineEvents();
      };
    });
    container.querySelectorAll('[data-line-char]').forEach(btn => {
      btn.onclick = () => {
        const line = lines.find(l => l.id === btn.dataset.lineChar);
        if(!line) return;
        if(!line.charValues) line.charValues = {};
        const charId = btn.dataset.charId, valueId = btn.dataset.valueId;
        line.charValues[charId] = (line.charValues[charId] === valueId) ? undefined : valueId;
        bindLineEvents();
      };
    });
    container.querySelectorAll('[data-del-line]').forEach(btn => {
      btn.onclick = () => { lines = lines.filter(l => l.id !== btn.dataset.delLine); bindLineEvents(); };
    });
  }

  bindPhotoEvents();
  bindLineEvents();

  document.getElementById('btnAddLine').onclick = () => {
    lines.forEach(l => { l.expanded = false; });
    lines.push({ id:newId(), sizeIds: [], categoryId:'', brandId:'', qty:1, charValues:{}, expanded:true });
    bindLineEvents();
  };
  const cancelBtn = document.getElementById('mCancel');
  if(cancelBtn) cancelBtn.onclick = closeModal;
  const deleteBtn = document.getElementById('btnDeleteLot');
  if(deleteBtn) deleteBtn.onclick = () => openConfirmModal('Supprimer ce lot ?', 'La ou les photos et tous les articles de ce lot seront définitivement supprimés.', () => {
    (existingLot.photos || []).forEach(deletePhotoRef);
    activeV2List().lots = activeV2List().lots.filter(l => l.id !== existingLot.id);
    save(); closeModal(); render(); showToast('Lot supprimé');
  });
  document.getElementById('mSave').onclick = () => {
    const price = Math.max(0, parseFloat(document.getElementById('newVetementPrice').value) || 0);
    const validLines = lines.filter(l => l.sizeIds.length && l.categoryId);
    if(!validLines.length){ showToast('Ajoutez au moins un article avec une taille et une catégorie'); return; }
    photos.forEach(p => { if(!p.id) p.id = uploadPhoto(p.src); });
    removedExistingPhotoIds.forEach(deletePhotoRef);
    const photoIds = photos.map(p => p.id);
    const hiddenIds = photos.filter(p => p.hidden).map(p => p.id);
    const entries = validLines.map(l => ({ id:l.id, sizeIds:l.sizeIds.slice(), categoryId:l.categoryId, brandId:l.brandId || '', qty:l.qty, charValues: Object.assign({}, l.charValues) }));
    if(isNew){
      if(!Array.isArray(activeV2List().lots)) activeV2List().lots = [];
      activeV2List().lots.push({ id:newId(), photos:photoIds, hiddenPhotos:hiddenIds, price, entries });
    } else {
      existingLot.photos = photoIds;
      existingLot.hiddenPhotos = hiddenIds;
      existingLot.price = price;
      existingLot.entries = entries;
    }
    save(); closeModal(); render(); showToast(isNew ? 'Vêtement ajouté' : 'Lot mis à jour');
  };
}

function v2RemoveCategoryReferences(list, categoryId){
  list.targets = (list.targets || []).filter(t => t.categoryId !== categoryId);
  (list.characteristics || []).forEach(ch => { ch.categoryIds = (ch.categoryIds || []).filter(id => id !== categoryId); });
  (list.lots || []).forEach(lot => {
    lot.entries = (lot.entries || []).filter(e => e.categoryId !== categoryId);
  });
  list.lots = (list.lots || []).filter(lot => {
    if((lot.entries || []).length === 0){ (lot.photos || []).forEach(deletePhotoRef); return false; }
    return true;
  });
}
function v2RemoveSizeReferences(list, sizeId){
  list.targets = (list.targets || []).filter(t => t.sizeId !== sizeId);
  (list.lots || []).forEach(lot => {
    lot.entries = (lot.entries || []).map(e => {
      if(!(e.sizeIds || []).includes(sizeId)) return e;
      return Object.assign({}, e, { sizeIds: e.sizeIds.filter(id => id !== sizeId) });
    }).filter(e => (e.sizeIds || []).length > 0);
  });
  list.lots = (list.lots || []).filter(lot => {
    if((lot.entries || []).length === 0){ (lot.photos || []).forEach(deletePhotoRef); return false; }
    return true;
  });
}

function openEditCharacteristicModal(existingChar){
  const isNew = !existingChar;
  let label = isNew ? '' : existingChar.label;
  let values = isNew ? [] : existingChar.values.map(v => ({ ...v }));
  let categoryIds = isNew ? [] : (existingChar.categoryIds || []).slice();

  function valuesHtml(){
    return values.length ? values.map((v, i) => `
      <span class="chip-btn" style="cursor:default; padding:0;">
        <button type="button" data-rename-value="${i}" style="border:none; background:none; cursor:pointer; font:inherit; color:inherit; padding:6px 4px 6px 12px;">${escapeHtml(v.label)}</button>
        <button type="button" data-del-value="${i}" style="border:none; background:none; cursor:pointer; padding:6px 10px 6px 4px; display:inline-flex;">${icon('x','icon-sm')}</button>
      </span>
    `).join('') : '<span style="font-size:12.5px; color:var(--muted);">Aucune valeur</span>';
  }
  function catChecksHtml(){
    return v2SortByLabel(activeV2List().categories).map(c => `
      <label class="crosslist-check"><input type="checkbox" data-char-cat="${c.id}" ${categoryIds.includes(c.id) ? 'checked' : ''}> ${escapeHtml(c.label)}</label>
    `).join('');
  }

  function draw(){
    openModal(`
      <h2>${isNew ? 'Nouvelle caractéristique' : 'Modifier la caractéristique'}</h2>
      <div class="field">
        <label class="field-label">Nom</label>
        <input type="text" id="charLabel" placeholder="ex. Manche" value="${escapeAttr(label)}">
      </div>
      <div class="field">
        <label class="field-label">Valeurs possibles</label>
        <div id="charValuesList" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;">${valuesHtml()}</div>
        <div style="display:flex; gap:8px;">
          <input type="text" id="newCharValue" placeholder="ex. Manches longues" style="flex:1;">
          <button type="button" class="chip-btn" id="btnAddCharValue">Ajouter</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Catégories concernées</label>
        <div class="crosslist-checks" id="charCatsList">${catChecksHtml()}</div>
      </div>
      <div class="modal-actions">
        ${!isNew ? `<button type="button" class="btn btn-danger" id="btnDeleteChar">${icon('trash','icon-sm')} Supprimer</button>` : `<button class="btn btn-secondary" id="mCancel">Annuler</button>`}
        <button class="btn btn-primary" id="mSave">Enregistrer</button>
      </div>
    `);

    function refreshValues(){ document.getElementById('charValuesList').innerHTML = valuesHtml(); bindValueButtons(); }
    function bindValueButtons(){
      document.querySelectorAll('[data-del-value]').forEach(btn => {
        btn.onclick = () => { values.splice(parseInt(btn.dataset.delValue, 10), 1); refreshValues(); };
      });
      document.querySelectorAll('[data-rename-value]').forEach(btn => {
        btn.onclick = () => {
          label = document.getElementById('charLabel').value; // conserve la saisie en cours
          const idx = parseInt(btn.dataset.renameValue, 10);
          openRenamePrompt('Valeur', values[idx].label, (val) => { values[idx].label = val; draw(); });
        };
      });
    }
    bindValueButtons();

    document.getElementById('btnAddCharValue').onclick = () => {
      const input = document.getElementById('newCharValue');
      const l = input.value.trim();
      if(!l){ showToast('Indiquez une valeur'); return; }
      values.push({ id:newId(), label:l });
      input.value = '';
      refreshValues();
    };
    document.querySelectorAll('[data-char-cat]').forEach(cb => {
      cb.onchange = () => {
        const id = cb.dataset.charCat;
        if(cb.checked){ if(!categoryIds.includes(id)) categoryIds.push(id); }
        else { categoryIds = categoryIds.filter(x => x !== id); }
      };
    });
    const cancelBtn = document.getElementById('mCancel');
    if(cancelBtn) cancelBtn.onclick = closeModal;
    const deleteBtn = document.getElementById('btnDeleteChar');
    if(deleteBtn) deleteBtn.onclick = () => openConfirmModal(
      'Supprimer cette caractéristique ?',
      'Elle sera retirée, ainsi que les valeurs déjà choisies sur vos articles pour celle-ci.',
      () => {
        activeV2List().characteristics = activeV2List().characteristics.filter(c => c.id !== existingChar.id);
        save(); closeModal(); openManageV2Modal();
      }
    );
    document.getElementById('mSave').onclick = () => {
      const lbl = document.getElementById('charLabel').value.trim();
      if(!lbl){ showToast('Indiquez un nom'); return; }
      if(!values.length){ showToast('Ajoutez au moins une valeur'); return; }
      if(isNew){
        if(!Array.isArray(activeV2List().characteristics)) activeV2List().characteristics = [];
        activeV2List().characteristics.push({ id:newId(), label:lbl, values, categoryIds });
      } else {
        existingChar.label = lbl;
        existingChar.values = values;
        existingChar.categoryIds = categoryIds;
      }
      save(); closeModal(); openManageV2Modal(); showToast(isNew ? 'Caractéristique ajoutée' : 'Caractéristique modifiée');
    };
  }
  draw();
}

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

function compressImageFile(file){
  return new Promise((resolve, reject) => {
    const objectUrl = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try{
        const maxW = 2200;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.92));
      }catch(err){ reject(err); }
      finally{ URL.revokeObjectURL(objectUrl); }
    };
    img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error('load-failed')); };
    img.src = objectUrl;
  });
}

/* ---------- Modals ---------- */
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

function openLightbox(photos, startIndex){
  const root = document.getElementById('lightboxRoot');
  const items = photos.map(p => (typeof p === 'string') ? { src: p } : p);
  let idx = clamp(startIndex, 0, items.length - 1);
  function close(){ root.innerHTML = ''; }
  function go(delta){ idx = (idx + delta + items.length) % items.length; draw(); }
  function draw(){
    const cur = items[idx];
    root.innerHTML = `
      <div class="lightbox-overlay" id="lbOverlay">
        <button class="lightbox-close" id="lbClose" aria-label="Fermer">${icon('x')}</button>
        ${items.length > 1 ? `<button class="lightbox-nav lightbox-prev" id="lbPrev" aria-label="Photo précédente">${icon('chevronLeft')}</button>` : ''}
        <div class="lightbox-imgwrap" id="lbImgWrap"><img class="lightbox-img" id="lbImg" src="${cur.src}"></div>
        ${items.length > 1 ? `<button class="lightbox-nav lightbox-next" id="lbNext" aria-label="Photo suivante">${icon('chevronLeft')}</button>` : ''}
        <div class="lightbox-footer">
          ${cur.caption ? `<div class="lightbox-caption">${escapeHtml(cur.caption)}</div>` : ''}
          ${items.length > 1 ? `<div class="lightbox-count">${idx + 1} / ${items.length}</div>` : ''}
          ${cur.onGoto ? `<button class="btn btn-primary" id="lbGoto">${escapeHtml(cur.gotoLabel || 'Voir l’article')}</button>` : ''}
        </div>
      </div>
    `;
    const overlay = document.getElementById('lbOverlay');
    const imgWrap = document.getElementById('lbImgWrap');
    const imgEl = document.getElementById('lbImg');
    document.getElementById('lbClose').onclick = close;
    overlay.addEventListener('mousedown', (e) => { if(e.target.id === 'lbOverlay') close(); });

    // --- Zoom pincé (2 doigts), panoramique (1 doigt quand zoomé),
    //     double-tap pour zoomer, et balayage gauche/droite quand pas zoomé.
    let scale = 1, tx = 0, ty = 0;
    let pinchStartDist = null, pinchStartScale = 1;
    let panStartX = 0, panStartY = 0;
    let swipeStartX = null, swipeStartY = null;
    let lastTapTime = 0;

    function clampPan(){
      const maxX = (imgWrap.clientWidth * (scale - 1)) / 2;
      const maxY = (imgWrap.clientHeight * (scale - 1)) / 2;
      tx = clamp(tx, -maxX, maxX);
      ty = clamp(ty, -maxY, maxY);
    }
    function applyTransform(){
      imgEl.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    }
    function resetZoom(){ scale = 1; tx = 0; ty = 0; applyTransform(); }
    function distance(t0, t1){ return Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY); }

    if(items.length > 1){
      document.getElementById('lbPrev').onclick = () => go(-1);
      document.getElementById('lbNext').onclick = () => go(1);
    }

    imgWrap.addEventListener('touchstart', (e) => {
      if(e.touches.length === 2){
        pinchStartDist = distance(e.touches[0], e.touches[1]);
        pinchStartScale = scale;
        swipeStartX = null;
      } else if(e.touches.length === 1){
        if(scale > 1){
          panStartX = e.touches[0].clientX - tx;
          panStartY = e.touches[0].clientY - ty;
        } else {
          swipeStartX = e.touches[0].clientX;
          swipeStartY = e.touches[0].clientY;
        }
      }
    }, { passive:true });

    imgWrap.addEventListener('touchmove', (e) => {
      if(e.touches.length === 2 && pinchStartDist){
        e.preventDefault();
        const newDist = distance(e.touches[0], e.touches[1]);
        scale = clamp(pinchStartScale * (newDist / pinchStartDist), 1, 4);
        clampPan();
        applyTransform();
      } else if(e.touches.length === 1 && scale > 1){
        e.preventDefault();
        tx = e.touches[0].clientX - panStartX;
        ty = e.touches[0].clientY - panStartY;
        clampPan();
        applyTransform();
      }
    }, { passive:false });

    imgWrap.addEventListener('touchend', (e) => {
      if(e.touches.length === 0){
        pinchStartDist = null;
        if(scale < 1.05) resetZoom();
        if(swipeStartX !== null && scale <= 1){
          const t = e.changedTouches[0];
          const dx = (t ? t.clientX : swipeStartX) - swipeStartX;
          const dy = (t ? t.clientY : swipeStartY) - swipeStartY;
          if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) && items.length > 1){
            go(dx < 0 ? 1 : -1);
            swipeStartX = null;
            return;
          }
          const now = Date.now();
          if(now - lastTapTime < 300){
            scale = scale > 1 ? 1 : 2.4;
            tx = 0; ty = 0;
            applyTransform();
            lastTapTime = 0;
          } else {
            lastTapTime = now;
          }
        }
        swipeStartX = null;
      }
    }, { passive:true });

    if(cur.onGoto) document.getElementById('lbGoto').onclick = () => { close(); cur.onGoto(); };
  }
  draw();
}

let guestData = null;
let guestReservations = {};
let guestActiveListId = null;

function guestLabel(arr, id){
  const x = (arr || []).find(i => i.id === id);
  return x ? x.label : '';
}
function guestEntryMatchesNeed(e, sizeId, categoryId, charId, mainChar, valueId){
  if(!((e.sizeIds || []).includes(sizeId) && e.categoryId === categoryId)) return false;
  if(charId) return e.charValues && e.charValues[charId] === valueId;
  if(mainChar) return !(e.charValues && e.charValues[mainChar.id]); // bucket "Indifférent"
  return true;
}
function guestNeedStats(list, sizeId, categoryId, charId, mainChar, valueId){
  let acquired = 0;
  const photoIds = [];
  (list.lots || []).forEach(lot => {
    let matched = false;
    (lot.entries || []).forEach(e => {
      if(guestEntryMatchesNeed(e, sizeId, categoryId, charId, mainChar, valueId)){
        acquired += Number(e.qty) || 0;
        matched = true;
      }
    });
    if(matched){
      (lot.photos || []).forEach(id => {
        if(!(lot.hiddenPhotos || []).includes(id) && photoIds.length < 4) photoIds.push(id);
      });
    }
  });
  return { acquired, photoIds };
}
function guestReservationKey(listId, sizeId, categoryId, charId, valueId){
  return [listId, sizeId, categoryId, charId || '', valueId || ''].join('::');
}
function reservedBadgeHtml(sizeId, categoryId, charId, valueId){
  const list = activeV2List();
  if(!list) return '';
  const key = guestReservationKey(list.id, sizeId, categoryId, charId, valueId);
  return reservations[key] ? `<span class="reserved-badge">🎁 Réservé</span>` : '';
}
function guestCollectNeeds(list){
  const needs = [];
  (list.targets || []).forEach(t => {
    const targetVal = Number(t.target) || 0;
    if(targetVal <= 0) return;
    const cat = (list.categories || []).find(c => c.id === t.categoryId);
    if(!cat) return; // objectif orphelin (catégorie supprimée) : on l'ignore
    const sizeExists = (list.sizes || []).some(s => s.id === t.sizeId);
    if(!sizeExists) return; // idem pour une taille supprimée
    const chars = v2CharacteristicsForCategoryInList(list, t.categoryId);
    const mainChar = chars[0] || null;
    let valueLabel = '';
    if(t.charId && mainChar){
      const val = (mainChar.values || []).find(v => v.id === t.valueId);
      valueLabel = val ? val.label : '';
    } else if(t.charId && !mainChar){
      return; // objectif orphelin lié à une caractéristique disparue
    }
    const { acquired, photoIds } = guestNeedStats(list, t.sizeId, t.categoryId, t.charId, mainChar, t.valueId);
    needs.push({
      sizeId: t.sizeId, categoryId: t.categoryId, charId: t.charId || null, valueId: t.valueId || null,
      sizeLabel: guestLabel(list.sizes, t.sizeId),
      categoryLabel: cat.label,
      valueLabel, acquired, target: targetVal, remaining: Math.max(0, targetVal - acquired),
      photoIds,
      comment: cat.comment || ''
    });
  });
  return needs;
}
function v2CharacteristicsForCategoryInList(list, categoryId){
  return (list.characteristics || []).filter(ch => (ch.categoryIds || []).includes(categoryId));
}

function guestFirebaseInit(){
  try{ firebase.initializeApp(firebaseConfig); }catch(e){}
  photoDbRef = firebase.database().ref('petitNidPhotos');
  firebase.database().ref('petitNidData').on('value', snap => {
    guestData = snap.val();
    if(guestData) applyTheme(guestData.theme);
    renderGuestView();
  });
  firebase.database().ref('petitNidReservations').on('value', snap => {
    guestReservations = snap.val() || {};
    renderGuestView();
  });
}

function promptGuestName(cb){
  const stored = localStorage.getItem('nidouxGuestName');
  if(stored){ cb(stored); return; }
  openModal(`
    <h2>Comment vous appelez-vous ?</h2>
    <p style="color:var(--muted); font-size:13px; margin:-6px 0 10px;">Pour que les autres sachent que c'est déjà prévu.</p>
    <div class="field"><input type="text" id="guestNameInput" placeholder="Votre prénom"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="mCancel">Annuler</button>
      <button class="btn btn-primary" id="mSave">Valider</button>
    </div>
  `);
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mSave').onclick = () => {
    const name = document.getElementById('guestNameInput').value.trim();
    if(!name){ showToast('Indiquez votre prénom'); return; }
    localStorage.setItem('nidouxGuestName', name);
    closeModal();
    cb(name);
  };
}

function renderGuestView(){
  const main = document.getElementById('mainContent');
  if(!guestData){
    main.innerHTML = `<div class="empty-state">${icon('sparkle','icon-lg')}<div>Chargement…</div></div>`;
    return;
  }
  if(guestActiveListId) renderGuestListDetail();
  else renderGuestListPicker();
}

function renderGuestListPicker(){
  const main = document.getElementById('mainContent');
  const lists = (guestData.v2lists || []).filter(l => l.mode !== 'checklist');
  const withNeeds = lists.map(l => ({ list:l, needs: guestCollectNeeds(l) }));
  main.innerHTML = `
    <div class="guest-header">
      <h1>🎁 Liste de naissance</h1>
      <p>Ce qu'on a déjà, et ce qu'il reste à trouver.</p>
    </div>
    <div class="cat-grid" style="padding:0 16px 24px;">
      ${withNeeds.map(({list, needs}) => {
        const remaining = needs.filter(n => n.remaining > 0).length;
        return `<button type="button" class="cat-card" data-guest-list="${list.id}">
          <div class="cat-icon" style="background:${list.color || 'var(--sage-dark)'};">${icon(list.icon || 'box','icon-lg')}</div>
          <div>
            <div class="cat-name">${escapeHtml(list.name)}</div>
            <div class="cat-meta">${remaining ? remaining + ' article' + (remaining > 1 ? 's' : '') + ' à offrir' : 'Tout est déjà prévu ✓'}</div>
          </div>
        </button>`;
      }).join('')}
    </div>
  `;
  document.querySelectorAll('[data-guest-list]').forEach(btn => {
    btn.onclick = () => { guestActiveListId = btn.dataset.guestList; renderGuestView(); };
  });
}

let guestCollapsed = {};

function guestNeedStatusHtml(n){
  return n.remaining <= 0 ? '✓ complet' : 'encore ' + n.remaining;
}
function guestNeedExtrasHtml(n){
  const resKey = guestReservationKey(guestActiveListId, n.sizeId, n.categoryId, n.charId, n.valueId);
  const res = guestReservations[resKey];
  const myName = (localStorage.getItem('nidouxGuestName') || '').toLowerCase();
  const isMine = res && (res.name || '').toLowerCase() === myName;
  const complete = n.remaining <= 0;
  return `
    ${n.photoIds.length ? `<div class="guest-need-photos">${n.photoIds.map(id => `<img data-photo-src="${id}" alt="" class="guest-need-photo">`).join('')}</div>` : ''}
    ${n.comment ? `<div class="guest-need-comment">${escapeHtml(n.comment)}</div>` : ''}
    ${complete ? '' : (res ? `
      <span class="guest-claimed-pill">${isMine ? 'Réservé par vous' : 'Réservé'}${isMine ? ` <button type="button" data-guest-unclaim="${resKey}">Annuler</button>` : ''}</span>
    ` : `<button type="button" class="chip-btn guest-claim-chip" data-guest-claim="${resKey}">🎁 Je m'en occupe</button>`)}
  `;
}

function renderGuestListDetail(){
  const main = document.getElementById('mainContent');
  const list = (guestData.v2lists || []).find(l => l.id === guestActiveListId);
  if(!list){ guestActiveListId = null; renderGuestView(); return; }
  const needs = guestCollectNeeds(list);
  const bySize = {};
  needs.forEach(n => { (bySize[n.sizeId] = bySize[n.sizeId] || []).push(n); });
  const sizeOrder = (list.sizes || []).map(s => s.id).filter(id => bySize[id]);

  function categoryGroupHtml(sizeId, categoryId, groupNeeds){
    const catLabel = groupNeeds[0].categoryLabel;
    if(groupNeeds.length === 1 && !groupNeeds[0].charId){
      const n = groupNeeds[0];
      return `<div class="v2-line-card guest-need-row">
        <div class="guest-need-top">
          <span class="guest-need-name">${escapeHtml(catLabel)}</span>
          <span class="guest-need-qty">${guestNeedStatusHtml(n)}</span>
        </div>
        ${guestNeedExtrasHtml(n)}
      </div>`;
    }
    const groupKey = 'g-' + sizeId + '::' + categoryId;
    const explicit = guestCollapsed[groupKey];
    const anyRemaining = groupNeeds.some(n => n.remaining > 0);
    const collapsed = (explicit === true || explicit === false) ? explicit : !anyRemaining;
    const totalRemaining = groupNeeds.reduce((s, n) => s + n.remaining, 0);
    return `
      <div class="v2-char-group guest-cat-group">
        <div class="v2-group-heading-toggle ${collapsed ? '' : 'open'}" data-guest-group-toggle="${groupKey}">
          <span class="v2-group-label">${escapeHtml(catLabel)}</span>
          <span class="guest-need-qty">${totalRemaining > 0 ? 'encore ' + totalRemaining : '✓ complet'}</span>
          <span class="chev">${icon('chevronDown','icon-sm')}</span>
        </div>
        <div class="v2-char-group-body ${collapsed ? '' : 'open'}">
          ${groupNeeds.map(n => `
            <div class="guest-value-row">
              <div class="guest-value-top">
                <span class="guest-value-label">${escapeHtml(n.valueLabel || 'Indifférent')}</span>
                <span class="guest-need-qty">${guestNeedStatusHtml(n)}</span>
              </div>
              ${guestNeedExtrasHtml(n)}
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  main.innerHTML = `
    <div class="guest-header" style="text-align:left; padding-bottom:0;">
      <button type="button" class="guest-back" id="guestBack">${icon('chevronLeft','icon-sm')} Toutes les listes</button>
      <h1 style="text-align:left; font-size:19px;">${escapeHtml(list.name)}</h1>
    </div>
    <div style="padding:6px 16px 24px;">
      ${needs.length ? sizeOrder.map(sizeId => {
        const byCategory = {};
        bySize[sizeId].forEach(n => { (byCategory[n.categoryId] = byCategory[n.categoryId] || []).push(n); });
        const catIds = Object.keys(byCategory).sort((a, b) => byCategory[a][0].categoryLabel.localeCompare(byCategory[b][0].categoryLabel, 'fr'));
        return `
          <div class="section-heading">${escapeHtml(guestLabel(list.sizes, sizeId))}</div>
          ${catIds.map(catId => categoryGroupHtml(sizeId, catId, byCategory[catId])).join('')}
        `;
      }).join('') : `<div class="empty-state">${icon('sparkle','icon-lg')}<div>Aucun objectif renseigné pour cette liste pour l’instant.</div></div>`}
    </div>
  `;
  document.getElementById('guestBack').onclick = () => { guestActiveListId = null; renderGuestView(); };
  document.querySelectorAll('[data-guest-group-toggle]').forEach(el => {
    el.onclick = () => {
      const key = el.dataset.guestGroupToggle;
      guestCollapsed[key] = el.classList.contains('open');
      renderGuestView();
    };
  });
  document.querySelectorAll('[data-guest-claim]').forEach(btn => {
    btn.onclick = () => {
      const resKey = btn.dataset.guestClaim;
      promptGuestName(name => {
        firebase.database().ref('petitNidReservations/' + resKey).set({ name, at: Date.now() });
        showToast('Merci ' + name + ' !');
      });
    };
  });
  document.querySelectorAll('[data-guest-unclaim]').forEach(btn => {
    btn.onclick = () => {
      firebase.database().ref('petitNidReservations/' + btn.dataset.guestUnclaim).remove();
      showToast('Réservation annulée');
    };
  });
  hydratePhotoImages(main);
}

/* ---------- Nav & boot ---------- */
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.onclick = () => {
    ui.view = btn.dataset.nav;
    saveUi();
    render();
  };
});

document.getElementById('settingsBtn').onclick = () => {
  if(isAdminUnlocked) openSettingsPanel();
  else openAdminAccessModal(() => openSettingsPanel());
};

function formatNotifTime(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit' }) + ' à ' + d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
}

function openNotifPanel(){
  const shown = notifications.slice(0, 30);
  openModal(`
    <h2>Notifications</h2>
    ${shown.length ? `
      <div style="display:flex; flex-direction:column; gap:6px; max-height:60vh; overflow-y:auto;">
        ${shown.map(n => `
          <button type="button" class="v2-line-card" data-notif-goto="${n.id}" style="text-align:left; padding:10px 12px; cursor:pointer; ${n.read ? '' : 'background:var(--sage-tint);'}">
            <div style="font-weight:800; font-size:13.5px; color:var(--ink);">${escapeHtml(n.title)}</div>
            ${n.body ? `<div style="font-size:12.5px; color:var(--muted); margin-top:2px;">${escapeHtml(n.body)}</div>` : ''}
            <div style="font-size:11px; color:var(--muted-2); margin-top:3px;">${formatNotifTime(n.at)}</div>
          </button>
        `).join('')}
      </div>
    ` : `<p style="color:var(--muted); font-size:13px;">Aucune notification pour l’instant.</p>`}
    <div class="modal-actions">
      <button class="btn btn-secondary" id="mCancel">Fermer</button>
    </div>
  `);
  document.getElementById('mCancel').onclick = closeModal;
  document.querySelectorAll('[data-notif-goto]').forEach(btn => {
    btn.onclick = () => {
      const n = notifications.find(x => x.id === btn.dataset.notifGoto);
      closeModal();
      if(n && n.listId && n.sizeId && n.categoryId){
        const list = (data.v2lists || []).find(l => l.id === n.listId);
        if(list){
          ui.activeV2ListId = n.listId;
          ui.view = 'listsv2';
          const groupBy = list.groupBy || 'size';
          if(groupBy === 'category') ui.collapsedSections['v2c-' + n.categoryId] = false;
          else ui.collapsedSections['v2-' + n.sizeId] = false;
          ui.expandedItems['v2-' + n.sizeId + '::' + n.categoryId] = true;
          saveUi();
          render();
        }
      }
    };
  });
  notifications.forEach(n => { n.read = true; });
  saveNotifications();
  updateNotifyBadge();
}

document.getElementById('notifyBtn').onclick = openNotifPanel;

const isGuestMode = new URLSearchParams(location.search).get('cadeaux') === '1';
if(isGuestMode){
  document.querySelector('header.app-header').style.display = 'none';
  document.querySelector('nav.bottom-nav').style.display = 'none';
  guestFirebaseInit();
} else {
  updateConnectionBadge('offline');
  updateNotifyBadge();
  render();
  initFirebase();
}
})();
</script>
