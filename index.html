<style>
  :root{
    --bg:#FAF6EC;
    --card:#FFFFFF;
    --ink:#3A3529;
    --muted:#8C8171;
    --muted-2:#B3A997;
    --sage:#93AC89;
    --sage-dark:#5D7A54;
    --sage-tint:#E8EFE3;
    --terracotta:#E29A78;
    --terracotta-dark:#C06E48;
    --terracotta-tint:#FBEAE1;
    --blue:#A9C8D8;
    --blue-tint:#EAF3F6;
    --pink:#E6C2C2;
    --amber:#E3A44F;
    --amber-tint:#FBF0DE;
    --lavender:#B79BCB;
    --lavender-tint:#F1E9F6;
    --border:#EAE1CE;
    --r-sm:10px;
    --r-md:16px;
    --r-lg:26px;
    --shadow:0 2px 14px rgba(58,53,41,0.07);
    --shadow-lift:0 10px 30px rgba(58,53,41,0.14);
    --font-display:'Fraunces', serif;
    --font-body:'Nunito', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.45;
    padding-bottom:92px;
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  .icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;}
  .icon-sm{width:16px;height:16px;}
  .icon-lg{width:26px;height:26px;}

  header.app-header{
    position:sticky; top:0; z-index:20;
    background:rgba(250,246,236,0.92);
    backdrop-filter:blur(6px);
    padding:16px 18px 12px;
    border-bottom:1px solid var(--border);
  }
  .header-row{display:flex; align-items:center; gap:8px;}
  .header-title-block{flex:0 0 auto; min-width:0;}
  .header-tagline{
    flex:1; min-width:0; text-align:center; font-size:12.5px; color:var(--muted); font-weight:700;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 8px;
  }
  .header-actions{display:flex; align-items:center; flex-shrink:0;}
  .sync-badge{
    display:flex; align-items:center; gap:6px;
    font-size:13px; font-weight:800; color:var(--muted-2);
  }
  .sync-badge .dot{width:8px; height:8px; border-radius:50%; background:var(--muted-2); flex-shrink:0;}
  .sync-badge.online .dot{background:var(--sage-dark);}
  .sync-badge.online{color:var(--sage-dark);}
  .sync-badge.error .dot{background:var(--terracotta-dark);}
  .sync-badge.error{color:var(--terracotta-dark);}
  .brand{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .brand h1{
    font-family:var(--font-display);
    font-optical-sizing:auto;
    font-weight:600;
    font-style:italic;
    font-size:22px;
    margin:0;
    color:var(--sage-dark);
  }
  .brand span.dot{color:var(--terracotta);}
  .view-title{
    display:flex; align-items:center; gap:10px;
  }
  .back-btn{
    background:var(--card); border:1px solid var(--border); border-radius:999px;
    width:36px;height:36px; display:flex; align-items:center; justify-content:center;
    color:var(--ink); cursor:pointer; flex-shrink:0;
  }
  .back-btn:active{transform:scale(0.94);}

  main{padding:16px 16px 8px; max-width:640px; margin:0 auto;}

  /* Hero / countdown */
  .hero{
    background:linear-gradient(155deg, var(--sage-tint) 0%, #FFFDF8 65%);
    border:1px solid var(--border);
    border-radius:var(--r-lg);
    padding:16px 18px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
    margin-bottom:16px;
  }
  .hero::after{
    content:"";
    position:absolute; right:-30px; top:-30px; width:130px; height:130px;
    border-radius:50%;
    background:radial-gradient(circle, var(--terracotta-tint) 0%, transparent 70%);
  }
  .hero-label{color:var(--muted); font-size:13px; font-weight:700; letter-spacing:0.2px;}
  .hero-count-row{display:flex; align-items:center; gap:12px;}
  .hero-num{
    font-family:var(--font-display);
    font-weight:700;
    font-size:38px;
    line-height:1;
    color:var(--sage-dark);
    font-variant-numeric:tabular-nums;
    flex-shrink:0;
  }
  .hero-count-text{display:flex; flex-direction:column; gap:1px; min-width:0;}
  .hero-num-unit{font-size:13.5px; font-weight:800; color:var(--ink);}
  .hero-date{font-size:12px; color:var(--muted);}
  .icon-btn-ghost{
    background:transparent; border:none; color:var(--muted); cursor:pointer;
    width:32px;height:32px; display:flex; align-items:center; justify-content:center;

  .photo-add-tile{
    width:64px; height:64px; border-radius:var(--r-sm); border:1.5px dashed var(--muted-2);
    display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:pointer; background:#fff; flex-shrink:0;
  }
  .photo-add-tile.uploading{cursor:default; border-style:solid; border-color:var(--sage-tint); background:var(--sage-tint);}
  .photo-add-spinner{
    width:20px; height:20px; border-radius:50%; border:2.5px solid var(--sage-dark); border-top-color:transparent;
    animation:spin 0.7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .item-thumb-wrap{position:relative; flex-shrink:0; border:none; background:none; padding:0; cursor:pointer;}
  .v2-row-char-summary{
    display:flex; flex-direction:column; align-items:stretch; justify-content:center; gap:3px; flex-shrink:0;
  }
  .v2-row-char-pill{
    color:#fff; border-radius:999px; white-space:nowrap;
    padding:3px 9px; font-size:11px; font-weight:800; text-align:center; line-height:1.3;
  }
  .v2-row-thumbs{display:flex; gap:4px; flex-shrink:0; margin-left:8px;}
  .v2-row-thumb{
    width:44px; height:44px; border-radius:9px; border:1px solid var(--border); padding:0;
    cursor:pointer; overflow:hidden; flex-shrink:0; background:#fff;
  }
  .v2-row-thumb img{width:100%; height:100%; object-fit:cover; display:block; background:#EFE8D8;}
  .v2-row-thumb-more{
    display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:800;
    color:var(--sage-dark); background:var(--sage-tint);
  }
  .item-thumb-count{
    position:absolute; bottom:-4px; right:-4px; background:var(--ink); color:#fff;
    font-size:9px; font-weight:800; border-radius:999px; padding:1px 4px; line-height:1.4; min-width:14px; text-align:center;
  }
  .lightbox-overlay{
    position:fixed; inset:0; background:rgba(20,17,13,0.94); z-index:300;
    display:flex; align-items:center; justify-content:center;
  }
  .lightbox-imgwrap{
    width:92vw; height:80vh; position:relative; overflow:hidden; touch-action:none;
  }
  .lightbox-img{
    width:100%; height:100%; border-radius:12px; object-fit:contain; display:block;
    transform-origin:center center; will-change:transform; user-select:none; -webkit-user-drag:none;
  }
  .lightbox-close{
    position:absolute; top:18px; right:18px; width:40px; height:40px; border-radius:50%;
    background:rgba(255,255,255,0.15); border:none; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .lightbox-nav{
    position:absolute; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:50%;
    background:rgba(255,255,255,0.15); border:none; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .lightbox-prev{left:12px;}
  .lightbox-next{right:12px;}
  .lightbox-next .icon{transform:rotate(180deg);}
  .lightbox-footer{
    position:absolute; bottom:22px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:8px; max-width:86vw;
  }
  .lightbox-caption{
    color:#fff; font-size:13px; font-weight:700; text-align:center;
    background:rgba(0,0,0,0.35); padding:6px 14px; border-radius:999px;
  }
  .lightbox-count{color:#fff; font-size:12px; font-weight:700; opacity:0.85;}
  .lightbox-hide-toggle{
    display:flex; align-items:center; gap:7px; color:#fff; font-size:12.5px; font-weight:700;
    background:rgba(0,0,0,0.35); padding:6px 12px; border-radius:999px; cursor:pointer;
  }
  .lightbox-hide-toggle input{width:15px; height:15px; accent-color:var(--sage-dark);}

  /* Photo gallery */
  .gallery-scroll{
    display:flex; gap:12px; overflow-x:auto; padding:2px 2px 12px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
    scroll-snap-type:x mandatory; scroll-padding-left:2px;
  }
  .gallery-scroll::-webkit-scrollbar{display:none;}
  .gallery-item{
    flex:0 0 auto; width:132px; background:none; border:none; padding:0; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; scroll-snap-align:start;
  }
  .gallery-item img{
    width:132px; height:132px; object-fit:cover; border-radius:var(--r-md);
    border:1px solid var(--border); box-shadow:var(--shadow);
  }
  .gallery-caption{
    font-size:12px; font-weight:700; color:var(--ink); margin-top:6px; text-align:center;
    width:132px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .gallery-caption-sub{font-weight:600; color:var(--muted); font-size:11px; margin-top:1px;}
  .expand-actions{display:flex; justify-content:space-between; align-items:center; margin-top:2px;}
  .text-btn{background:none; border:none; font-weight:800; font-size:13px; cursor:pointer; padding:6px 4px; display:inline-flex; align-items:center; gap:4px; white-space:nowrap;}
  .text-btn.danger{color:var(--terracotta-dark);}
  .text-btn.muted{color:var(--muted);}

  .add-row-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    width:100%; padding:11px; margin-top:4px; border-radius:var(--r-sm);
    border:1.5px dashed var(--muted-2); background:transparent; color:var(--sage-dark); font-weight:800; font-size:13.5px; cursor:pointer;
  }
  .add-row-btn:active{background:var(--sage-tint);}

  .cat-actions-row{display:flex; gap:8px; margin:14px 0 4px;}
  .chip-btn{
    display:flex; align-items:center; gap:6px; padding:8px 13px; border-radius:999px;
    border:1px solid var(--border); background:#fff; font-weight:700; font-size:12.5px; color:var(--ink); cursor:pointer;
  }
  .chip-btn.danger{color:var(--terracotta-dark); border-color:var(--terracotta-tint);}

  /* Bottom nav */
  nav.bottom-nav{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:rgba(255,253,248,0.96); backdrop-filter:blur(8px);
    border-top:1px solid var(--border);
    display:flex; padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    max-width:640px; margin:0 auto;
  }
  .nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--muted-2); font-size:11px; font-weight:800; padding:6px 0; cursor:pointer;
  }
  .nav-btn.active{color:var(--sage-dark);}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(58,53,41,0.38);
    display:flex; align-items:flex-end; justify-content:center; z-index:100;
  }
  @media (min-width:520px){ .overlay{align-items:center;} }
  .modal{
    background:#fff; width:100%; max-width:460px; border-radius:22px 22px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
    box-shadow:var(--shadow-lift);
    animation:slideUp 0.22s ease;
  }
  @media (min-width:520px){ .modal{border-radius:22px; animation:popIn 0.18s ease;} }
  @keyframes slideUp{from{transform:translateY(24px); opacity:0.4;} to{transform:translateY(0); opacity:1;}}
  @keyframes popIn{from{transform:scale(0.96); opacity:0.4;} to{transform:scale(1); opacity:1;}}
  .modal h2{font-family:var(--font-display); font-weight:600; font-size:19px; margin:0 0 14px;}
  .field{margin-bottom:12px;}
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .btn{
    flex:1; padding:12px; border-radius:999px; font-weight:800; font-size:14px; cursor:pointer; border:none;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-primary{background:var(--sage-dark); color:#fff;}
  .btn-primary:active{background:#4c6544;}
  .btn-secondary{background:#F2EDE0; color:var(--ink);}
  .btn-danger{background:var(--terracotta-dark); color:#fff;}
  .color-pick{display:flex; gap:8px; flex-wrap:wrap;}
  .swatch{width:34px; height:34px; border-radius:50%; cursor:pointer; border:2.5px solid transparent;}
  .swatch.selected{border-color:var(--ink);}

  .empty-state{
    text-align:center; padding:40px 20px; color:var(--muted);
  }
  .empty-state .icon-lg{margin:0 auto 10px; color:var(--muted-2);}

  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px;
    font-size:13px; font-weight:700; z-index:200; opacity:0; pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease; white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  .footer-link{
    display:block; text-align:center; font-size:12px; color:var(--muted-2); font-weight:700;
    margin:26px 0 10px; background:none; border:none; cursor:pointer; width:100%;
  }

  /* Search */
  .search-wrap{margin-bottom:14px;}
  .search-input-wrap{
    position:relative; display:flex; align-items:center;
    background:var(--card); border:1px solid var(--border); border-radius:999px;
    padding:0 14px; box-shadow:var(--shadow);
  }
  .search-input-wrap .icon{color:var(--muted-2); flex-shrink:0;}
  .search-input-wrap input{
    border:none; background:transparent; padding:11px 8px; font-size:14px; flex:1; min-width:0;
  }
  .search-input-wrap input:focus{outline:none;}
  .search-input-wrap input::-webkit-search-cancel-button{display:none;}
  .search-clear{background:none; border:none; color:var(--muted); cursor:pointer; padding:6px; display:flex; flex-shrink:0;}
  .search-result-row{
    width:100%; display:flex; align-items:center; gap:10px; padding:12px 10px;
    background:var(--card); border:1px solid var(--border); border-radius:var(--r-sm);
    margin-bottom:8px; cursor:pointer; text-align:left;
  }
  .search-result-row:active{background:var(--sage-tint);}
  .search-result-main{flex:1; min-width:0;}
  .search-result-breadcrumb{font-size:12px; color:var(--muted); font-weight:600; margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .search-result-count{font-size:12px; font-weight:800; color:var(--muted); flex-shrink:0;}

  /* Prono */
  .choice-row{display:flex; gap:8px;}
  .choice-btn{
    flex:1; padding:11px; border-radius:var(--r-sm); border:1px solid var(--border);
    background:#fff; font-weight:700; font-size:14px; color:var(--ink); cursor:pointer;
  }
  .choice-btn.selected{background:var(--sage-dark); color:#fff; border-color:var(--sage-dark);}
  .prono-row{
    background:var(--card); border:1px solid var(--border); border-radius:var(--r-md);
    padding:14px 16px; margin-bottom:10px; box-shadow:var(--shadow);
  }
  .prono-row-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .prono-name{font-weight:800; font-size:14.5px;}
  .prono-meta{font-size:12.5px; color:var(--muted); font-weight:600; margin-top:2px;}
  .prono-details{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12.5px; color:var(--muted); margin-top:10px;}
  .prono-details strong{color:var(--ink);}
  .prono-winner{border-color:var(--amber); background:var(--amber-tint);}
  .prono-rank{color:var(--muted); font-weight:800; margin-right:2px;}
  .prono-score{margin-top:10px; font-size:12.5px; font-weight:700; color:var(--sage-dark);}

  /* À faire */
  .todo-row{
    display:flex; align-items:flex-start; gap:12px; padding:13px 14px;
    background:var(--card); border:1px solid var(--border); border-radius:var(--r-md);
    margin-bottom:10px; box-shadow:var(--shadow);
  }
  .todo-row.done{opacity:0.6;}
  .todo-row.done .todo-text{text-decoration:line-through;}
  .todo-check{
    width:24px; height:24px; border-radius:50%; border:2px solid var(--muted-2); background:#fff;
    display:flex; align-items:center; justify-content:center; color:#fff; cursor:pointer; flex-shrink:0; margin-top:1px; padding:0;
  }
  .todo-check.checked{background:var(--sage-dark); border-color:var(--sage-dark);}
  .todo-main{flex:1; min-width:0; cursor:pointer;}
  .todo-text{font-weight:700; font-size:14.5px;}
  .todo-meta{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .todo-due{font-size:11.5px; font-weight:800; padding:3px 9px; border-radius:999px;}
  .todo-due-none{background:#F2EDE0; color:var(--muted);}
  .todo-due-later{background:var(--sage-tint); color:var(--sage-dark);}
  .todo-due-soon{background:var(--amber-tint); color:var(--amber);}
  .todo-due-overdue{background:var(--terracotta-tint); color:var(--terracotta-dark);}
  .todo-due-done{background:#F2EDE0; color:var(--muted);}
  .todo-assignee{font-size:11.5px; font-weight:700; color:var(--muted); padding:3px 9px; border-radius:999px; background:#F2EDE0;}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-row">
    <div id="headerContent" class="header-title-block"></div>
    <div id="headerTagline" class="header-tagline"></div>
    <div class="header-actions">
      <button class="icon-btn-ghost" id="notifyBtn" aria-label="Notifications">

      </button>

</header>

<main id="mainContent"></main>

<nav class="bottom-nav">
  <button class="nav-btn" data-nav="dashboard">
    <svg class="icon" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9"/></svg>
    Accueil
  </button>
  <button class="nav-btn" data-nav="listsv2">
    <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h5"/><circle cx="17.5" cy="15.5" r="1"/></svg>

  </button>
  <button class="nav-btn" data-nav="echo">

  </button>
  <button class="nav-btn" data-nav="todo">
    <svg class="icon" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>

  <button class="nav-btn" data-nav="leaves">

  </button>
  <button class="nav-btn" data-nav="prono">

<div id="modalRoot"></div>
<div id="lightboxRoot"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>

<script>
(function(){
"use strict";

/* ---------- Icons ---------- */
const ICONS = {

  pencil:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>',

  wallet:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16" cy="14.5" r="1.2"/>',
  bell:'<path d="M6 8a6 6 0 0112 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M9.5 20a2.5 2.5 0 005 0"/>',
  sort:'<path d="M7 16l5 5 5-5"/><path d="M7 8l5-5 5 5"/><path d="M12 3v18"/>',
  download:'<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/>',
  trophy:'<path d="M8 21h8M12 17v4"/><path d="M7 4h10v5a5 5 0 01-10 0V4z"/><path d="M7 5H4a3 3 0 003 4M17 5h3a3 3 0 01-3 4"/>'
};
function icon(name, cls){ return '<svg class="icon '+(cls||'')+'" viewBox="0 0 24 24">'+ICONS[name]+'</svg>'; }

/* ---------- Default data (Mes listes) ---------- */
const V2_DEFAULT_SIZES = ['1 mois','3 mois','6 mois','9 mois','12 mois','18 mois','Sans taille'];
const V2_DEFAULT_CATEGORIES = [
  'Body','T-shirt','Pull / Sweat','Gilet',
  'Pantalon','Legging','Short',
  'Pyjama','Combinaison','Grenouillère',
  'Veste','Manteau','Combi-pilote',
  'Bonnet','Chapeau','Chaussettes','Chaussons','Moufles','Bavoir',
  'Gigoteuse','Couverture',
  'Cape de bain','Serviette','Lange',
  'Doudou','Tenue de sortie'
];

/* ---------- Moteur de dates / règles légales congés (France, en vigueur mi-2026) ---------- */
function easterDateISO(year){
  const a = year % 19, b = Math.floor(year / 100), c = year % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19*a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2*e + 2*i - h - k) % 7;
  const m = Math.floor((a + 11*h + 22*l) / 451);
  const month = Math.floor((h + l - 7*m + 114) / 31);
  const day = ((h + l - 7*m + 114) % 31) + 1;
  return year + '-' + String(month).padStart(2,'0') + '-' + String(day).padStart(2,'0');
}
function parseISODate(s){ return s ? new Date(s + 'T00:00:00') : null; }
function toISODate(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function addDaysISO(s, n){ const d = parseISODate(s); d.setDate(d.getDate() + n); return toISODate(d); }
function addMonthsISO(s, n){ const d = parseISODate(s); d.setMonth(d.getMonth() + n); return toISODate(d); }
const _frenchHolidayCache = {};
function frenchHolidaysForYear(year){
  if(_frenchHolidayCache[year]) return _frenchHolidayCache[year];
  const easter = easterDateISO(year);
  const pad2 = (n) => String(n).padStart(2,'0');
  const list = new Set([
    year + '-01-01',
    addDaysISO(easter, 1),
    year + '-05-01',
    year + '-05-08',
    addDaysISO(easter, 39),
    addDaysISO(easter, 50),
    year + '-07-14',
    year + '-08-15',
    year + '-11-01',
    year + '-11-11',
    year + '-12-25'
  ]);
  _frenchHolidayCache[year] = list;
  return list;
}
function isHolidayISO(iso){
  return frenchHolidaysForYear(parseInt(iso.slice(0,4), 10)).has(iso);
}
function dowISO(iso){ return parseISODate(iso).getDay(); } // 0=dimanche..6=samedi
// Renvoie la date du n-ième jour ouvrable (tous les jours sauf dimanche et feries) a partir de start inclus.
function nthOuvrableFromISO(startIso, n){
  let d = startIso, count = 0;
  while(true){
    if(dowISO(d) !== 0 && !isHolidayISO(d)){
      count++;
      if(count >= n) return d;
    }
    d = addDaysISO(d, 1);
  }
}
// Compte les jours "consommés" (ouvrés ou ouvrables selon le mode) sur une periode donnee, bornes incluses.
function countConsumedDaysISO(startIso, endIso, mode){
  if(!startIso || !endIso || endIso < startIso) return 0;
  let d = startIso, count = 0;
  while(d <= endIso){
    const dow = dowISO(d);
    const excluded = mode === 'ouvrables' ? (dow === 0) : (dow === 0 || dow === 6);
    if(!excluded && !isHolidayISO(d)) count++;
    d = addDaysISO(d, 1);
  }
  return count;
}
const MATERNITE_DUREES = {
  '1-2':      { label:'1er ou 2e enfant',   before:6,  after:10 },
  '3+':       { label:'3e enfant ou plus',  before:8,  after:18 },
  'twins':    { label:'Jumeaux',            before:12, after:22 },
  'triplets': { label:'Triplés ou plus',    before:24, after:22 }
};
function paterniteJoursTotal(multiple){ return multiple ? 28 : 21; } // jours facultatifs fractionnables (hors 4 obligatoires)
function paterniteJoursObligatoires(){ return 4; }

function leaveComputed(lp){
  const birth = lp.birthDate || data.dueDate || '';
  const naissanceStart = lp.father.naissanceStart || birth;
  const naissanceEnd = naissanceStart ? nthOuvrableFromISO(naissanceStart, 3) : '';
  const obligStart = naissanceEnd ? addDaysISO(naissanceEnd, 1) : '';
  const obligEnd = obligStart ? addDaysISO(obligStart, paterniteJoursObligatoires() - 1) : '';
  const paterniteTotal = paterniteJoursTotal(lp.multipleBirth);
  const paterniteUsed = lp.father.optionalPeriods.reduce((s, p) => s + (Number(p.days) || 0), 0);
  const paterniteDeadline = birth ? addMonthsISO(birth, 6) : '';
  const mat = MATERNITE_DUREES[lp.childRank];
  let maternityStart, maternityBirthDay, maternityEnd;
  if(lp.mother.maternityStart){
    maternityStart = lp.mother.maternityStart;
    maternityBirthDay = addDaysISO(maternityStart, mat.before * 7);
    maternityEnd = addDaysISO(maternityStart, (mat.before + mat.after) * 7 - 1);
  } else if(birth){
    maternityBirthDay = birth;
    maternityStart = addDaysISO(birth, -mat.before * 7);
    maternityEnd = addDaysISO(birth, mat.after * 7 - 1);
  } else {
    maternityStart = maternityBirthDay = maternityEnd = '';
  }
  return { birth, naissanceStart, naissanceEnd, obligStart, obligEnd, paterniteTotal, paterniteUsed, paterniteDeadline, mat, maternityStart, maternityBirthDay, maternityEnd };
}

function collectLeaveBlocks(lp){
  const c = leaveComputed(lp);
  const blocks = [];
  if(c.naissanceStart && c.naissanceEnd) blocks.push({ start:c.naissanceStart, end:c.naissanceEnd, color:'var(--amber)', label:'Naissance (papa)' });
  if(c.obligStart && c.obligEnd) blocks.push({ start:c.obligStart, end:c.obligEnd, color:'var(--terracotta-dark)', label:'Paternité obligatoire' });
  lp.father.optionalPeriods.forEach(p => {
    if(!p.start) return;
    blocks.push({ start:p.start, end:addDaysISO(p.start, (Number(p.days)||5) - 1), color:'var(--sage-dark)', label:'Paternité (facultatif)' });
  });
  lp.father.csnPeriods.forEach(p => {
    if(!p.start) return;
    blocks.push({ start:p.start, end:addDaysISO(addMonthsISO(p.start, Number(p.months)||1), -1), color:'var(--lavender)', label:'Congé suppl. naissance (papa)' });
  });
  if(c.maternityStart && c.maternityEnd) blocks.push({ start:c.maternityStart, end:c.maternityEnd, color:'var(--blue)', label:'Maternité' });
  lp.mother.csnPeriods.forEach(p => {
    if(!p.start) return;
    blocks.push({ start:p.start, end:addDaysISO(addMonthsISO(p.start, Number(p.months)||1), -1), color:'var(--lavender)', label:'Congé suppl. naissance (maman)' });
  });
  lp.cpPeriods.forEach(p => {
    if(!p.start || !p.end || p.end < p.start) return;
    blocks.push({ start:p.start, end:p.end, color:'var(--muted-2)', label:'CP ' + (p.owner === 'mother' ? 'maman' : 'papa') });
  });
  return blocks;
}

function renderLeaveMonthGrid(year, month, blocks){
  const first = new Date(year, month, 1);
  const startDow = (first.getDay() + 6) % 7; // lundi=0
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthLabel = first.toLocaleDateString('fr-FR', { month:'long', year:'numeric' });
  let cells = '';
  for(let i = 0; i < startDow; i++) cells += `<div class="leave-cal-cell empty"></div>`;
  for(let day = 1; day <= daysInMonth; day++){
    const iso = year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    const dayBlocks = blocks.filter(b => iso >= b.start && iso <= b.end);
    const isWeekend = [0,6].includes(new Date(year, month, day).getDay());
    cells += `<div class="leave-cal-cell ${isWeekend ? 'weekend' : ''}" title="${dayBlocks.map(b=>b.label).join(', ')}">
      <span class="leave-cal-daynum">${day}</span>
      ${dayBlocks.length ? `<span class="leave-cal-dots">${dayBlocks.slice(0,4).map(b => `<i style="background:${b.color}"></i>`).join('')}</span>` : ''}
    </div>`;
  }
  return `
    <div class="leave-cal-header">
      <button type="button" class="text-btn" data-leave-cal-nav="-1">${icon('chevronLeft','icon-sm')}</button>
      <span class="leave-cal-month">${escapeHtml(monthLabel)}</span>
      <button type="button" class="text-btn" data-leave-cal-nav="1" style="transform:scaleX(-1);">${icon('chevronLeft','icon-sm')}</button>
    </div>
    <div class="leave-cal-grid">
      ${['L','M','M','J','V','S','D'].map(d => `<div class="leave-cal-cell dow">${d}</div>`).join('')}
      ${cells}
    </div>
  `;
}

let leaveCalYearMonth = null;

function leaveNextOuvrableAfter(iso){
  let d = addDaysISO(iso, 1);
  while(dowISO(d) === 0 || dowISO(d) === 6 || isHolidayISO(d)) d = addDaysISO(d, 1);
  return d;
}

function formatDateShort(iso){
  if(!iso) return '';
  return parseISODate(iso).toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' });
}

function renderLeavePeriodList(periods, kind){
  if(!periods.length) return `<p style="color:var(--muted); font-size:12px; margin:4px 0;">Aucune période ajoutée.</p>`;
  return periods.map(p => {
    let endIso, detail;
    if(kind === 'father-opt'){
      endIso = p.start ? addDaysISO(p.start, (Number(p.days) || 5) - 1) : '';
      detail = (Number(p.days) || 5) + ' jours';
    } else {
      endIso = p.start ? addDaysISO(addMonthsISO(p.start, Number(p.months) || 1), -1) : '';
      detail = (Number(p.months) || 1) + ' mois';
    }
    return `<div class="leave-period-row">
      <div>
        <div class="leave-period-dates">${p.start ? formatDateShort(p.start) + (endIso ? ' → ' + formatDateShort(endIso) : '') : 'Date non renseignée'}</div>
        <div class="leave-period-detail">${detail}</div>
      </div>
      <button type="button" class="text-btn danger" data-leave-del-period="${kind}::${p.id}">${icon('x','icon-sm')}</button>
    </div>`;
  }).join('');
}

function renderCpPeriodList(periods, mode){
  if(!periods.length) return `<p style="color:var(--muted); font-size:12px; margin:4px 0;">Aucune période ajoutée.</p>`;
  return periods.map(p => {
    const consumed = countConsumedDaysISO(p.start, p.end, mode);
    return `<div class="leave-period-row">
      <div>
        <div class="leave-period-dates">${p.owner === 'mother' ? '👩' : '👨'} ${p.start ? formatDateShort(p.start) : '?'} → ${p.end ? formatDateShort(p.end) : '?'}</div>
        <div class="leave-period-detail">${consumed} jour${consumed > 1 ? 's' : ''} de CP consommés</div>
      </div>
      <button type="button" class="text-btn danger" data-leave-del-cp="${p.id}">${icon('x','icon-sm')}</button>
    </div>`;
  }).join('');
}

function lightenHex(hex, amount){
  hex = String(hex || '').replace('#', '');
  if(hex.length !== 6) return hex ? '#' + hex : '#FFFFFF';
  const r = parseInt(hex.substr(0, 2), 16), g = parseInt(hex.substr(2, 2), 16), b = parseInt(hex.substr(4, 2), 16);
  const mix = (c) => Math.max(0, Math.min(255, Math.round(c + (255 - c) * amount)));
  return '#' + [mix(r), mix(g), mix(b)].map(v => v.toString(16).padStart(2, '0')).join('');
}

// Firebase Realtime Database supprime silencieusement les tableaux/objets vides
// ([] ou {}) lors de l'enregistrement : un champ "sections: []" ou "items: []"
// revient donc absent après une synchro. On reconstruit ces tableaux ici pour
// que le reste du code puisse toujours compter dessus sans planter.
// Reconstruit un tableau dense à partir d'une valeur qui peut être un vrai
// tableau JS, ou un objet à clés numériques (ce que Firebase renvoie quand
// certains indices d'un tableau ont été élagués car vides).
function denseArrayFrom(raw){
  if(Array.isArray(raw)) return raw;
  if(raw && typeof raw === 'object'){
    const keys = Object.keys(raw).map(k => parseInt(k, 10)).filter(n => !isNaN(n));
    if(!keys.length) return [];
    const maxIdx = Math.max(...keys);
    const arr = [];
    for(let i = 0; i <= maxIdx; i++) arr[i] = raw[i];
    return arr;
  }
  return [];
}

  if(v2.mode !== 'lots' && v2.mode !== 'catalog' && v2.mode !== 'checklist'){

  }
  v2.sizes = denseArrayFrom(v2.sizes).filter(Boolean);
  v2.categories = denseArrayFrom(v2.categories).filter(Boolean);
  v2.brands = denseArrayFrom(v2.brands).filter(Boolean);
  v2.groupBy = (v2.groupBy === 'category') ? 'category' : 'size';

  v2.targets = denseArrayFrom(v2.targets).filter(Boolean).map(t => {

    if(t.charId) out.charId = t.charId;
    if(t.valueId) out.valueId = t.valueId;
    return out;
  });
  // Fusionne d'éventuels doublons (même taille/catégorie/caractéristique/valeur) issus

  {

    v2.targets.forEach(t => dedup.set([t.sizeId, t.categoryId, t.charId || '', t.valueId || ''].join('::'), t));
    v2.targets = Array.from(dedup.values());
  }
  v2.characteristics = denseArrayFrom(v2.characteristics).filter(Boolean).map(c => ({
    id: c.id || newId(),
    label: c.label || '',
    values: denseArrayFrom(c.values).filter(Boolean).map(v => ({ id:v.id || newId(), label:v.label || '' })),
    categoryIds: denseArrayFrom(c.categoryIds).filter(Boolean)
  }));
  v2.lots = denseArrayFrom(v2.lots).filter(Boolean).map(lot => {
    lot.id = lot.id || newId();
    lot.photos = denseArrayFrom(lot.photos).filter(Boolean);
    lot.hiddenPhotos = denseArrayFrom(lot.hiddenPhotos).filter(Boolean);
    lot.price = Number(lot.price) || 0;
    lot.entries = denseArrayFrom(lot.entries).filter(Boolean).map(e => {
      let sizeIds = denseArrayFrom(e.sizeIds).filter(Boolean);
      if(!sizeIds.length && e.sizeId) sizeIds = [e.sizeId]; // migration depuis l'ancien format (une seule taille)
      return {

        qty: Math.max(1, parseInt(e.qty,10) || 1),
        charValues: (e.charValues && typeof e.charValues === 'object') ? e.charValues : {}

    });

  return v2;

// Récupère le contenu d'une photo par son id : instantané si déjà en cache,
// sinon un seul appel réseau par id (mutualisé si demandé plusieurs fois en parallèle).
function getPhotoSrc(id, cb){
  if(!id){ cb(''); return; }
  if(typeof id === 'string' && id.indexOf('data:') === 0){ cb(id); return; } // ancien format (pas encore migré) : c'est déjà la donnée
  if(photoCache.has(id)){ cb(photoCache.get(id)); return; }
  if(photoWaiters.has(id)){ photoWaiters.get(id).push(cb); return; }
  photoWaiters.set(id, [cb]);
  if(!photoDbRef){ cb(''); photoWaiters.delete(id); return; }
  photoDbRef.child(id).once('value').then(snap => {
    const val = snap.val() || '';
    photoCache.set(id, val);
    (photoWaiters.get(id) || []).forEach(fn => fn(val));
    photoWaiters.delete(id);
  }).catch(() => {
    (photoWaiters.get(id) || []).forEach(fn => fn(''));
    photoWaiters.delete(id);
  });
}
// Version Promise, pratique pour résoudre plusieurs photos d'un coup (lightbox, modales).
function getPhotoSrcAsync(id){
  return new Promise(resolve => getPhotoSrc(id, resolve));
}
// Stocke une nouvelle photo dans son propre nœud Firebase (jamais dans l'arbre
// principal synchronisé), et renvoie tout de suite son id — l'écriture réseau
// se fait en tâche de fond.
function uploadPhoto(dataUri){
  const id = newId();
  photoCache.set(id, dataUri);
  if(photoDbRef) photoDbRef.child(id).set(dataUri).catch(() => {});
  return id;
}
function deletePhotoRef(id){
  if(!id || (typeof id === 'string' && id.indexOf('data:') === 0)) return;
  photoCache.delete(id);
  if(photoDbRef) photoDbRef.child(id).remove().catch(() => {});

async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function recordV2Activity(list, lot, type){
  const entry = (lot.entries || [])[0];
  const sizeId = entry ? (entry.sizeIds || [])[0] : null;

    listId: list.id, sizeId, categoryId
  });

function notifyNewV2Activity(oldData, newData){
  const oldLots = v2CollectLotsById(oldData && oldData.v2lists);
  (newData.v2lists || []).forEach(list => {
    (list.lots || []).forEach(lot => {
      if(!lot || !lot.id) return;
      const oldLot = oldLots.get(lot.id);
      if(!oldLot){
        recordV2Activity(list, lot, 'article');
      } else if((lot.photos || []).length > (oldLot.photos || []).length){
        recordV2Activity(list, lot, 'photo');
      }
    });
  });
}

function migrateLegacyV2Photos(){
  if(data.v2PhotosMigratedV1) return false;
  let changed = false;
  (data.v2lists || []).forEach(list => {
    (list.lots || []).forEach(lot => {
      if(!Array.isArray(lot.photos)) return;
      const hiddenSet = new Set(lot.hiddenPhotos || []);
      const newHidden = [];
      lot.photos = lot.photos.map(p => {
        if(typeof p === 'string' && p.indexOf('data:') === 0){
          const id = uploadPhoto(p);
          if(hiddenSet.has(p)) newHidden.push(id);
          changed = true;
          return id;
        }
        if(hiddenSet.has(p)) newHidden.push(p);
        return p;
      });
      lot.hiddenPhotos = newHidden;
    });
  });
  data.v2PhotosMigratedV1 = true;
  return true;
}

function handleRemoteValue(snapshot){
  const remote = snapshot.val();
  if(isTypingInTextField()) return; // ne pas couper la saisie en cours d'un champ
  if(!remote){
    if(!bootstrapped){ dbRef.set(data); } // rien du tout côté serveur : on y dépose les données locales/par défaut
    bootstrapped = true;
    return;
  }
  const wasBootstrapped = bootstrapped;
  bootstrapped = true;
  const remoteStr = JSON.stringify(remote);
  if(remoteStr === lastSentJson) return; // c'est l'écho de notre propre écriture
  const previousData = data;
  data = normalizeData(remote);
  applyTheme(data.theme);
  const migrated = migrateLegacyV2Photos();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
  if(wasBootstrapped) notifyNewV2Activity(previousData, data);
  render();
  if(migrated) save();
}

function handleRemoteError(err){
  updateConnectionBadge('error');
  showToast('Connexion à Firebase impossible.');
}

function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch(e){ showToast('Stockage plein — impossible d’enregistrer une photo aussi grande.'); }
  if(!dbRef) return;
  clearTimeout(remoteDebounceTimer);
  remoteDebounceTimer = setTimeout(() => {
    lastSentJson = JSON.stringify(data);
    dbRef.set(data).catch(err => showToast('Échec de synchronisation : ' + err.message));
  }, 400);
}

function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

function itemStatus(target, acquired){
  if(target <= 0) return acquired > 0 ? 'surplus' : 'atteint';
  if(acquired > target) return 'surplus';
  if(acquired === target) return 'atteint';
  if(acquired / target >= 0.5) return 'encours';
  return 'incomplet';
}

function progressColor(pct){
  if(pct >= 100) return 'var(--sage-dark)';
  if(pct >= 50) return 'var(--amber)';

}

function formatPrice(n){

function daysUntil(dateStr){
  const due = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const b = new Date(due.getFullYear(), due.getMonth(), due.getDate());
  return Math.round((b - a) / 86400000);
}
function pregnancyProgress(){
  const start = new Date((data.pregnancyStart || '2026-06-25') + 'T00:00:00');
  const due = new Date(data.dueDate + 'T00:00:00');
  const now = new Date();
  const totalMs = due - start;
  const elapsedMs = now - start;
  const pct = totalMs > 0 ? clamp(Math.round((elapsedMs / totalMs) * 100), 0, 100) : 0;
  const totalWeeks = Math.max(1, Math.round(totalMs / (7 * 86400000)));
  const weeks = clamp(Math.floor(elapsedMs / (7 * 86400000)), 0, totalWeeks);
  return { pct, weeks, totalWeeks };
}

function normalizeSearch(s){
  return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function expandSearchTerms(query){
  const q = normalizeSearch(query);
  const terms = new Set([q]);
  (data.synonyms || []).forEach(group => {
    const normTerms = (group.terms || []).map(normalizeSearch);
    if(normTerms.some(t => t && (t.includes(q) || q.includes(t)))){
      normTerms.forEach(t => { if(t) terms.add(t); });
    }
  });
  return Array.from(terms);
}

function fmtDuration(ms){
  if(!isFinite(ms)) return '—';
  const totalMin = Math.round(ms / 60000);
  const days = Math.floor(totalMin / 1440);
  const hours = Math.floor((totalMin % 1440) / 60);
  const mins = totalMin % 60;
  const parts = [];
  if(days) parts.push(days + ' j');
  if(hours) parts.push(hours + ' h');
  if(!days && mins) parts.push(mins + ' min');
  return parts.length ? parts.join(' ') : '0 min';
}

// Classe chaque pronostic par rang sur chaque critère renseigné (date/heure, sexe,
// prénom, poids, taille), puis additionne ces rangs : le total le plus bas gagne.
// C'est équivalent à un classement golfique, ce qui permet de comparer équitablement
// des critères aussi différents qu'un écart de temps, un poids et un sexe deviné.
function computeRankings(list, result){
  if(!result || list.length === 0) return null;
  const actualDateTime = result.actualDate
    ? new Date(result.actualDate + 'T' + (result.actualTime || '12:00')).getTime()
    : null;
  const hasWeight = result.actualWeightKg !== undefined && result.actualWeightKg !== '' && result.actualWeightKg !== null;
  const hasHeight = result.actualHeightCm !== undefined && result.actualHeightCm !== '' && result.actualHeightCm !== null;
  const hasSex = !!result.actualSex;
  const hasName = !!(result.actualFirstName && result.actualFirstName.trim());
  if(!actualDateTime && !hasWeight && !hasHeight && !hasSex && !hasName) return null;

  function numDiff(guess, actual){
    const g = parseFloat(guess), a = parseFloat(actual);
    if(isNaN(g) || isNaN(a)) return Infinity;
    return Math.abs(g - a);
  }
  function rankOf(values){
    const finite = values.filter(v => isFinite(v)).sort((a,b) => a - b);
    return values.map(v => isFinite(v) ? finite.indexOf(v) + 1 : finite.length + 1);
  }

  const dtVals = list.map(p => {
    if(!actualDateTime || !p.guessDate) return Infinity;
    return Math.abs(new Date(p.guessDate + 'T' + (p.guessTime || '12:00')).getTime() - actualDateTime);
  });
  const wVals = hasWeight ? list.map(p => numDiff(p.weightKg, result.actualWeightKg)) : null;
  const hVals = hasHeight ? list.map(p => numDiff(p.heightCm, result.actualHeightCm)) : null;
  const dtRanks = actualDateTime ? rankOf(dtVals) : null;
  const wRanks = wVals ? rankOf(wVals) : null;
  const hRanks = hVals ? rankOf(hVals) : null;

  return list.map((p, i) => {
    let score = 0, criteria = 0;
    const entry = { p };
    if(dtRanks){ entry.dtDiffMs = dtVals[i]; score += dtRanks[i]; criteria++; }
    if(wRanks){ entry.wDiff = wVals[i]; score += wRanks[i]; criteria++; }
    if(hRanks){ entry.hDiff = hVals[i]; score += hRanks[i]; criteria++; }
    if(hasSex){ entry.sexOk = p.sex === result.actualSex; score += entry.sexOk ? 1 : 2; criteria++; }
    if(hasName){ entry.nameOk = !!p.firstNameGuess && normalizeSearch(p.firstNameGuess) === normalizeSearch(result.actualFirstName); score += entry.nameOk ? 1 : 2; criteria++; }
    entry.score = criteria > 0 ? score : null;
    return entry;
  }).sort((a, b) => {
    if(a.score === null) return 1;
    if(b.score === null) return -1;
    return a.score - b.score;
  });
}

  const dateLabel = p.guessDate ? formatDate(p.guessDate) : 'Date non renseignée';
  return `<div class="prono-row ${isWinner ? 'prono-winner' : ''}">
    <div class="prono-row-top">
      <div>
        <div class="prono-name">
          ${isWinner ? icon('trophy','icon-sm') : `<span class="prono-rank">#${rank}</span>`}
          ${escapeHtml(p.firstName)} ${escapeHtml(p.lastName)}
        </div>
        <div class="prono-meta">${dateLabel}${p.guessTime ? ' à ' + escapeHtml(p.guessTime) : ''} · ${sexLabel}</div>
      </div>

    </div>
    <div class="prono-details">
      ${p.firstNameGuess ? `<span>Prénom : <strong>${escapeHtml(p.firstNameGuess)}</strong>${r.nameOk === true ? ' ✅' : r.nameOk === false ? ' ❌' : ''}</span>` : ''}
      ${p.weightKg ? `<span>Poids : <strong>${escapeHtml(p.weightKg)} kg</strong>${isFinite(r.wDiff) ? ' (écart ' + r.wDiff.toFixed(2) + ' kg)' : ''}</span>` : ''}
      ${p.heightCm ? `<span>Taille : <strong>${escapeHtml(p.heightCm)} cm</strong>${isFinite(r.hDiff) ? ' (écart ' + r.hDiff.toFixed(1) + ' cm)' : ''}</span>` : ''}

  </div>`;
}

function downloadDataAsFile(){
  try{
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const dateStr = new Date().toISOString().slice(0, 10);
    const a = document.createElement('a');
    a.href = url;
    a.download = `nidoux-sauvegarde-${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }catch(e){ /* le stockage cloud reste le principal filet de sécurité */ }
}

function formatDateTime(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' }) +
    ' à ' + d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
}

function saveBackupNow(){
  if(!backupRef){ showToast('Connexion indisponible, réessayez plus tard.'); return; }
  downloadDataAsFile();
  backupRef.set({ snapshot: data, createdAt: Date.now() })
    .then(() => { showToast('Sauvegarde enregistrée'); refreshBackupInfo(); })
    .catch(err => showToast('Échec de la sauvegarde : ' + err.message));
}

function refreshBackupInfo(){
  const el = document.getElementById('backupInfo');
  const restoreBtn = document.getElementById('btnRestoreBackup');
  if(!el) return; // le panneau des réglages a été fermé entre-temps
  if(!backupRef){ el.textContent = 'Connexion indisponible.'; return; }
  backupRef.child('createdAt').once('value').then(snap => {
    const at = snap.val();
    const elNow = document.getElementById('backupInfo');
    const btnNow = document.getElementById('btnRestoreBackup');
    if(!elNow) return;
    if(at){
      elNow.textContent = 'Dernière sauvegarde : ' + formatDateTime(at);
      if(btnNow) btnNow.disabled = false;
    } else {
      elNow.textContent = 'Aucune sauvegarde pour le moment.';
    }
  }).catch(() => { const elNow = document.getElementById('backupInfo'); if(elNow) elNow.textContent = 'Impossible de vérifier la sauvegarde.'; });
}

function restoreFromBackup(){
  if(!backupRef){ showToast('Connexion indisponible, réessayez plus tard.'); return; }
  openConfirmModal(
    'Restaurer la dernière sauvegarde ?',
    'Toutes les données actuelles (listes, photos, prix, échographies, prono, tâches) seront remplacées par celles de la dernière sauvegarde. Cette action est irréversible.',
    () => {
      backupRef.child('snapshot').once('value').then(snap => {
        const snapshot = snap.val();
        if(!snapshot){ showToast('Aucune sauvegarde disponible.'); closeModal(); return; }
        data = normalizeData(snapshot);
        save();
        closeModal();
        render();
        showToast('Données restaurées');
      }).catch(err => { showToast('Échec de la restauration : ' + err.message); closeModal(); });
    },
    'Restaurer',
    'download'
  );
}

/* ---------- Échographies ---------- */
function weekForDate(dateStr){
  if(!dateStr) return null;
  const start = new Date((data.pregnancyStart || '2026-06-25') + 'T00:00:00');
  const d = new Date(dateStr + 'T00:00:00');
  const week = Math.floor((d - start) / (7 * 86400000));
  return week < 0 ? 0 : week;
}

function collectEchoPhotos(){
  const out = [];
  (data.ultrasounds || []).slice()
    .sort((a, b) => (a.date || '').localeCompare(b.date || ''))
    .forEach(u => (u.photos || []).forEach(src => out.push({ src, date: u.date, note: u.note })));
  return out;
}

function bindEchoEntryEvents(u){
  const card = document.querySelector(`[data-echo-card="${u.id}"]`);
  if(!card) return;

  const editBtn = card.querySelector(`[data-edit-echo="${u.id}"]`);
  if(editBtn) editBtn.onclick = () => openEditEchoModal(u);

  const delBtn = card.querySelector(`[data-del-echo="${u.id}"]`);
  if(delBtn) delBtn.onclick = () => openConfirmModal(
    'Supprimer cette échographie ?',
    `L’échographie du ${u.date ? formatDate(u.date) : '—'} et ses photos seront supprimées.`,
    () => {
      data.ultrasounds = data.ultrasounds.filter(x => x.id !== u.id);
      save(); closeModal(); render(); showToast('Échographie supprimée');
    }
  );

  const photoInput = card.querySelector(`[data-echo-photo="${u.id}"]`);
  if(photoInput) photoInput.onchange = (e) => handleEchoPhotoUpload(e, u);

  card.querySelectorAll('[data-del-echo-photo]').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.index, 10);
      u.photos.splice(idx, 1);

    };
  });

  card.querySelectorAll('[data-zoom-echo]').forEach(imgEl => {
    imgEl.onclick = () => openLightbox(u.photos, parseInt(imgEl.dataset.index, 10));
  });
}

function handleEchoPhotoUpload(e, u){
  const files = Array.from(e.target.files || []).filter(f => f.type && f.type.startsWith('image/'));
  e.target.value = '';
  if(!files.length){ showToast('Aucune image valide sélectionnée.'); return; }
  Promise.allSettled(files.map(compressImageFile)).then(results => {
    let added = 0;
    results.forEach(r => { if(r.status === 'fulfilled'){ u.photos.push(r.value); added++; } });
    if(added > 0){ save(); render(); }
    showToast(added > 0 ? (added > 1 ? added + ' photos ajoutées' : 'Photo ajoutée') : 'Impossible de traiter ces photos.');
  });
}

/* ---------- À faire ---------- */
function sortedTodos(){
  return (data.todos || []).slice().sort((a, b) => {
    if(a.done !== b.done) return a.done ? 1 : -1;
    const aHas = !!a.dueDate, bHas = !!b.dueDate;
    if(aHas !== bHas) return aHas ? -1 : 1;
    if(aHas && bHas) return a.dueDate.localeCompare(b.dueDate);
    return 0;
  });
}

function todoDueClass(t){
  if(t.done) return 'todo-due-done';
  if(!t.dueDate) return 'todo-due-none';
  const days = daysUntil(t.dueDate);
  if(days < 0) return 'todo-due-overdue';
  if(days <= 7) return 'todo-due-soon';
  return 'todo-due-later';
}

  const main = document.getElementById('mainContent');
  const todos = sortedTodos();
  main.innerHTML = `

  `;

    return;
  }
  listEl.innerHTML = todos.map(t => renderTodoRow(t)).join('');

}

/* ---------- Mes listes V2 ---------- */
function v2SizeLabel(id){ const s = (activeV2List().sizes||[]).find(x=>x.id===id); return s ? s.label : '—'; }
function v2CategoryLabel(id){ const c = (activeV2List().categories||[]).find(x=>x.id===id); return c ? c.label : '—'; }
function v2BrandLabel(id){ if(!id) return ''; const b = (activeV2List().brands||[]).find(x=>x.id===id); return b ? b.label : ''; }
function v2LotTags(list, lot){
  const categoryLabels = [...new Set((lot.entries || []).map(e => {
    const c = (list.categories || []).find(x => x.id === e.categoryId);
    return c ? c.label : null;
  }).filter(Boolean))];
  const sizeLabels = [...new Set((lot.entries || []).flatMap(e => (e.sizeIds || [])).map(id => {
    const s = (list.sizes || []).find(x => x.id === id);
    return s ? s.label : null;
  }).filter(Boolean))];
  return { categoryLabels, sizeLabels };
}
function renderV2GalleryTags(tags, maxWidth){
  const all = [
    ...tags.categoryLabels.map(l => ({ label: l, size: false })),
    ...tags.sizeLabels.map(l => ({ label: l, size: true }))
  ];
  if(!all.length) return '';
  const MAX_TAGS = 3;
  const shown = all.slice(0, MAX_TAGS);
  const extra = all.length - shown.length;
  return `<div class="gallery-tags" style="max-width:${maxWidth}px;">
    ${shown.map(t => `<span class="v2-tag ${t.size ? 'v2-tag-size' : ''}">${escapeHtml(t.label)}</span>`).join('')}
    ${extra > 0 ? `<span class="v2-tag v2-tag-size">+${extra}</span>` : ''}
  </div>`;
}

function v2AcquiredFor(sizeId, categoryId){
  const list = activeV2List();
  if(v2IsChecklist(list)){
    const t = (list.targets || []).find(t => t.sizeId === sizeId && t.categoryId === categoryId && !t.charId);
    return (t && t.checked) ? (Number(t.target) || 0) : 0;
  }
  let n = 0;
  (list.lots || []).forEach(lot => (lot.entries || []).forEach(e => {
    if((e.sizeIds || []).includes(sizeId) && e.categoryId === categoryId) n += Number(e.qty) || 0;
  }));
  return n;
}
function v2TargetEntriesFor(sizeId, categoryId){
  return (activeV2List().targets || []).filter(t => t.sizeId === sizeId && t.categoryId === categoryId);
}
function v2TargetFor(sizeId, categoryId){
  return v2TargetEntriesFor(sizeId, categoryId).reduce((s, t) => s + (t.target || 0), 0);
}
function v2AcquiredForValue(sizeId, categoryId, charId, valueId){
  let n = 0;
  (activeV2List().lots || []).forEach(lot => (lot.entries || []).forEach(e => {
    if((e.sizeIds || []).includes(sizeId) && e.categoryId === categoryId && e.charValues && e.charValues[charId] === valueId) n += Number(e.qty) || 0;
  }));
  return n;
}
function v2TargetForValue(sizeId, categoryId, charId, valueId){
  const t = (activeV2List().targets || []).find(t => t.sizeId === sizeId && t.categoryId === categoryId && t.charId === charId && t.valueId === valueId);
  return t ? t.target : 0;
}
function v2EntriesFor(sizeId, categoryId){
  const out = [];
  (activeV2List().lots || []).forEach(lot => (lot.entries || []).forEach(e => {
    if((e.sizeIds || []).includes(sizeId) && e.categoryId === categoryId) out.push({ lot, entry:e });
  }));
  return out;
}
function v2CharTargetRows(sizeId, categoryId, mainChar, entries){
  const indiffTarget = v2TargetEntriesFor(sizeId, categoryId).find(t => !t.charId);
  const indiffAcquired = entries.reduce((s, { entry }) => s + ((entry.charValues && entry.charValues[mainChar.id]) ? 0 : (Number(entry.qty) || 0)), 0);
  const rows = [{ charId: null, valueId: null, label: 'Indifférent', acquired: indiffAcquired, target: indiffTarget ? (Number(indiffTarget.target) || 0) : 0 }];
  mainChar.values.forEach(v => {
    rows.push({
      charId: mainChar.id,
      valueId: v.id,
      label: v.label,
      acquired: v2AcquiredForValue(sizeId, categoryId, mainChar.id, v.id),
      target: Number(v2TargetForValue(sizeId, categoryId, mainChar.id, v.id)) || 0
    });
  });
  return rows;
}
function v2SortByLabel(arr){
  return (arr || []).slice().sort((a, b) => a.label.localeCompare(b.label, 'fr', { numeric: true, sensitivity: 'base' }));
}
function v2SortListsByName(arr){
  return (arr || []).slice().sort((a, b) => a.name.localeCompare(b.name, 'fr', { numeric: true, sensitivity: 'base' }));
}
function v2CategoriesForSize(sizeId){
  return v2SortByLabel((activeV2List().categories || []).filter(c => v2TargetFor(sizeId, c.id) > 0 || v2EntriesFor(sizeId, c.id).length > 0));
}

function v2SizeTotals(sizeId){

function v2CategoryTotals(categoryId){

function v2GlobalTotalsForList(list){
  let acquired = 0, target = 0;
  if(v2IsChecklist(list)){
    (list.targets || []).forEach(t => {
      target += t.target || 0;
      acquired += t.checked ? (Number(t.target) || 0) : 0;
    });
  } else {
    (list.targets || []).forEach(t => {
      let a = 0;
      (list.lots || []).forEach(lot => (lot.entries || []).forEach(e => {
        if((e.sizeIds || []).includes(t.sizeId) && e.categoryId === t.categoryId) a += Number(e.qty) || 0;
      }));
      target += t.target;
      acquired += Math.min(a, t.target);
    });
  }
  const pct = target > 0 ? Math.round((acquired / target) * 100) : 0;
  return { acquired, target, pct };
}

function v2GlobalTotals(){

}

function budgetTotalsForV2List(list){
  let spent = 0;
  const perCategory = {};
  (list.lots || []).forEach(lot => {
    const price = Number(lot.price) || 0;
    spent += price;
    const totalQty = (lot.entries || []).reduce((s, e) => s + (Number(e.qty) || 0), 0);
    if(totalQty > 0 && price > 0){
      const perUnit = price / totalQty;
      (lot.entries || []).forEach(e => {
        if(!perCategory[e.categoryId]) perCategory[e.categoryId] = { spent:0, qty:0 };
        perCategory[e.categoryId].spent += perUnit * (Number(e.qty) || 0);
        perCategory[e.categoryId].qty += Number(e.qty) || 0;
      });
    }
  });
  let projected = 0;
  (list.targets || []).forEach(t => {
    const cd = perCategory[t.categoryId];
    if(cd && cd.qty > 0) projected += (cd.spent / cd.qty) * t.target;
  });
  return { spent, projected };
}

function budgetTotalsV2(){
  return budgetTotalsForV2List(activeV2List());
}

function budgetTotalsV2Global(){
  let spent = 0, projected = 0;
  (data.v2lists || []).forEach(list => {
    const b = budgetTotalsForV2List(list);
    spent += b.spent; projected += b.projected;
  });
  return { spent, projected };
}

function searchItemsV2(query){
  const terms = expandSearchTerms(query);
  if(!terms.length || !terms[0]) return [];
  const results = [];
  (activeV2List().categories || []).forEach(cat => {
    const nName = normalizeSearch(cat.label);
    if(!terms.some(t => t && nName.includes(t))) return;
    (activeV2List().sizes || []).forEach(size => {
      if(v2TargetFor(size.id, cat.id) > 0 || v2EntriesFor(size.id, cat.id).length > 0){
        results.push({ size, cat });
      }
    });
  });
  return results;
}

function searchItemsV2Global(query){
  const terms = expandSearchTerms(query);
  if(!terms.length || !terms[0]) return [];
  const results = [];
  (data.v2lists || []).forEach(list => {
    (list.categories || []).forEach(cat => {
      const nName = normalizeSearch(cat.label);
      if(!terms.some(t => t && nName.includes(t))) return;
      (list.sizes || []).forEach(size => {
        const hasTarget = (list.targets || []).some(t => t.sizeId === size.id && t.categoryId === cat.id && t.target > 0);
        const hasEntries = (list.lots || []).some(lot => (lot.entries || []).some(e => e.categoryId === cat.id && (e.sizeIds || []).includes(size.id)));
        if(hasTarget || hasEntries) results.push({ list, size, cat });
      });
    });
  });
  return results;
}

function v2GlobalTotalsAcrossLists(){
  let acquired = 0, target = 0;
  (data.v2lists || []).forEach(list => {
    const t = v2GlobalTotalsForList(list);
    acquired += t.acquired; target += t.target;
  });
  const pct = target > 0 ? Math.round((acquired / target) * 100) : 0;
  return { acquired, target, pct };
}

function collectV2LotPhotoRefs(){
  const out = [];
  (activeV2List().lots || []).forEach(lot => (lot.photos || []).forEach(src => { if(src) out.push({ lot, src }); }));
  const sortMode = activeV2List().photoSort || 'date';
  if(sortMode === 'date'){
    out.reverse(); // les lots sont ajoutés à la suite : inverser fait remonter les plus récents en premier
  } else {
    const sizeIndex = {};
    (activeV2List().sizes || []).forEach((s, i) => { sizeIndex[s.id] = i; });
    const minSizeIdx = (lot) => {
      let m = Infinity;
      (lot.entries || []).forEach(e => (e.sizeIds || []).forEach(sid => {
        if(sizeIndex[sid] !== undefined) m = Math.min(m, sizeIndex[sid]);
      }));
      return m;
    };
    out.sort((a, b) => minSizeIdx(a.lot) - minSizeIdx(b.lot));
  }
  return out;
}

      <div class="section-head ${collapsed ? '' : 'open'}" data-v2-cat-card-toggle="${cat.id}">
        <div class="section-info">
          <div class="section-title-row"><span class="section-title">${escapeHtml(cat.label)}</span></div>
          <div class="section-progress"><div class="track thin"><div class="fill" style="width:${t.pct}%; background:${progressColor(t.pct)}"></div></div></div>
        </div>
        <span class="section-count">${t.acquired}/${t.target}</span>
        <span class="chev">${icon('chevronDown','icon-sm')}</span>
      </div>
      <div class="section-body ${collapsed ? '' : 'open'}">
        ${sizes.length ? sizes.map(size => renderV2PairRow(size.id, cat.id, size.label)).join('') : `<p style="color:var(--muted); font-size:12.5px; margin:4px;">Aucun objectif ni article pour cette catégorie pour l’instant.</p>`}
        ${remaining.length ? renderV2QuickAdd('category', cat.id, remaining) : ''}
      </div>
    </div>

}

function renderV2QuickAdd(mode, fixedId, options){
  const list = activeV2List();
  if(mode === 'size' && v2UsesSimpleFlow(list)){
    return `
      <div class="v2-quickadd" data-v2-catalog-newcat="${fixedId}">
        <input type="text" class="v2-quickadd-newcat-input" placeholder="Nouvel ${list.categoryLabel.toLowerCase()}…" style="flex:1; min-width:0;">
        <input type="number" min="0" class="v2-quickadd-target" placeholder="Objectif" value="1">
        <button type="button" class="chip-btn v2-quickadd-btn">${icon('plus','icon-sm')} Ajouter</button>
      </div>
    `;
  }
  const attr = mode === 'size' ? 'data-v2-quickadd-size' : 'data-v2-quickadd-cat';
  const placeholder = mode === 'size' ? `Ajouter : ${list.categoryLabel}…` : `Ajouter : ${list.sizeLabel}…`;
  return `
    <div class="v2-quickadd" ${attr}="${fixedId}">
      <select class="v2-quickadd-select">
        <option value="">${placeholder}</option>
        ${options.map(o => `<option value="${o.id}">${escapeHtml(o.label)}</option>`).join('')}
      </select>
      <input type="number" min="0" class="v2-quickadd-target" placeholder="Objectif" value="1">
      <button type="button" class="chip-btn v2-quickadd-btn">${icon('plus','icon-sm')} Ajouter</button>
    </div>
  `;
}

function v2PhotoRefsForPair(sizeId, categoryId){
  const out = [];
  (activeV2List().lots || []).forEach(lot => {
    const has = (lot.entries || []).some(e => e.categoryId === categoryId && (e.sizeIds || []).includes(sizeId));
    if(has) (lot.photos || []).forEach(src => { if(src) out.push({ lot, src }); });
  });
  return out;
}

function renderV2RowThumbs(key, photoRefs){
  const maxShown = 2;
  const shown = photoRefs.slice(0, maxShown);
  const extra = photoRefs.length - shown.length;
  return `<div class="v2-row-thumbs">
    ${shown.map((r, i) => `<button class="v2-row-thumb" data-v2-pair-thumb="${key}" data-thumb-index="${i}"><img data-photo-src="${r.src}" alt=""></button>`).join('')}
    ${extra > 0 ? `<button class="v2-row-thumb v2-row-thumb-more" data-v2-pair-thumb="${key}" data-thumb-index="${maxShown}">+${extra}</button>` : ''}
  </div>`;
}

function v2CharPillColor(status){
  switch(status){
    case 'atteint': return 'var(--sage-dark)';
    case 'encours': return 'var(--amber)';
    case 'surplus': return 'var(--lavender)';
    default: return 'var(--terracotta-dark)';
  }
}

function renderV2RowCharSummary(rows){
  const withTarget = rows.filter(r => r.charId && r.target > 0);
  if(!withTarget.length) return '';
  const MAX_PILLS = 3;
  const shown = withTarget.slice(0, MAX_PILLS);
  const extra = withTarget.length - shown.length;
  return `<div class="v2-row-char-summary">
    ${shown.map(r => {
      const color = v2CharPillColor(itemStatus(r.target, r.acquired));
      return `<span class="v2-row-char-pill" style="background:${color}">${escapeHtml(r.label)} ${r.acquired}/${r.target}</span>`;
    }).join('')}
    ${extra > 0 ? `<span class="v2-row-char-pill" style="background:var(--muted-2);">+${extra}</span>` : ''}
  </div>`;
}

function anyReservedForPair(sizeId, categoryId){
  const list = activeV2List();
  if(!list) return false;
  if(reservations[guestReservationKey(list.id, sizeId, categoryId, null, null)]) return true;
  const mainChar = v2CharacteristicsForCategory(categoryId)[0] || null;
  if(mainChar){
    for(const v of mainChar.values){
      if(reservations[guestReservationKey(list.id, sizeId, categoryId, mainChar.id, v.id)]) return true;
    }
  }
  return false;
}

function isUrlLike(str){
  return /^https?:\/\/\S+$/i.test((str || '').trim());
}
function commentFieldHtml(categoryId, catObj){
  const value = (catObj && catObj.comment) || '';
  return `<div class="field">
    <label class="field-label">Commentaire</label>
    ${isUrlLike(value) ? `<a href="${escapeAttr(value.trim())}" target="_blank" rel="noopener" class="chip-btn" style="margin-bottom:6px; display:inline-flex;">${icon('link','icon-sm')} Ouvrir le lien</a>` : ''}
    <textarea data-v2-cat-comment="${categoryId}" placeholder="Optionnel… (un lien collé ici s'ouvrira facilement)" style="min-height:40px;">${escapeHtml(value)}</textarea>
  </div>`;
}
function renderV2PairRow(sizeId, categoryId, label){
  const acquired = v2AcquiredFor(sizeId, categoryId);
  const target = v2TargetFor(sizeId, categoryId);
  const status = itemStatus(target, acquired);
  const key = sizeId + '::' + categoryId;
  const expanded = !!ui.expandedItems['v2-' + key];
  const entries = v2EntriesFor(sizeId, categoryId);
  const photoRefs = v2PhotoRefsForPair(sizeId, categoryId);
  const list = activeV2List();
  const checklistMode = v2IsChecklist(list);
  const mainChar = checklistMode ? null : (v2CharacteristicsForCategory(categoryId)[0] || null);
  const charRows = mainChar ? v2CharTargetRows(sizeId, categoryId, mainChar, entries) : [];
  const catalogMode = v2IsCatalog(list);
  const isReserved = anyReservedForPair(sizeId, categoryId);
  const pairCatObj = (list.categories || []).find(c => c.id === categoryId);
  const hasComment = !!(pairCatObj && pairCatObj.comment);
  let html = `<div class="item-row" data-v2-cat-row="${key}">
    <span class="status-dot status-${status}"></span>
    <div class="item-main" data-v2-cat-toggle="${key}">
      <div class="item-name-row"><span class="item-name">${escapeHtml(label)}</span>${isReserved ? `<span class="reserved-badge" style="margin-left:6px;">🎁</span>` : ''}${hasComment ? `<span title="Un commentaire est renseigné" style="margin-left:6px;">📝</span>` : ''}</div>
      <div class="item-sub"><span>${acquired} / ${target}</span></div>
    </div>
    ${charRows.length ? renderV2RowCharSummary(charRows) : ''}
    ${photoRefs.length ? renderV2RowThumbs(key, photoRefs) : ''}
  </div>`;
  if(expanded){
    html += `<div class="item-expand">`;
    if(checklistMode){
      const t = (list.targets || []).find(t => t.sizeId === sizeId && t.categoryId === categoryId && !t.charId);
      const checked = !!(t && t.checked);
      const catObj = (list.categories || []).find(c => c.id === categoryId);
      html += `
        <div class="field">
          <label class="field-label">Objectif</label>
          <input type="number" min="0" data-v2-target="${key}" value="${target}">
        </div>
        ${reservedBadgeHtml(sizeId, categoryId, null, null)}
        <label class="v2-checklist-check">
          <input type="checkbox" data-v2-checklist-toggle="${key}" ${checked ? 'checked' : ''}>
          <span>Déjà dans la valise</span>
        </label>
        <div class="field">
          <label class="field-label">Commentaire</label>
          ${isUrlLike((catObj && catObj.comment) || '') ? `<a href="${escapeAttr(((catObj && catObj.comment) || '').trim())}" target="_blank" rel="noopener" class="chip-btn" style="margin-bottom:6px; display:inline-flex;">${icon('link','icon-sm')} Ouvrir le lien</a>` : ''}
          <textarea data-v2-cat-comment="${categoryId}" placeholder="Optionnel… (un lien collé ici s'ouvrira facilement)" style="min-height:40px;">${escapeHtml((catObj && catObj.comment) || '')}</textarea>
        </div>
        <button type="button" class="text-btn danger" data-v2-delete-pair="${key}" style="margin-top:6px;">${icon('trash','icon-sm')} Supprimer "${escapeHtml(label)}" de cette ${list.sizeLabel.toLowerCase()}</button>
      `;
      html += `</div>`;
      return html;
    }    if(catalogMode){
      const catObj = (list.categories || []).find(c => c.id === categoryId);
      html += `<button type="button" class="add-row-btn" data-v2-catalog-add="${key}">${icon('camera','icon-sm')} Ajouter un achat</button>
      ${commentFieldHtml(categoryId, catObj)}`;
    }
    if(mainChar){
      const indiffRow = charRows.find(r => !r.charId);
      const indiffEntries = entries.filter(({ entry }) => !(entry.charValues && entry.charValues[mainChar.id]));
      const anyValueHasTarget = mainChar.values.some(v => (Number(v2TargetForValue(sizeId, categoryId, mainChar.id, v.id)) || 0) > 0);
      const hideIndiff = anyValueHasTarget && (indiffRow.target || 0) === 0 && indiffEntries.length === 0;
      if(!hideIndiff){
        html += renderV2CharGroup(key, 'v2g-' + key + '::' + mainChar.id + '::indiff', indiffRow, indiffEntries, mainChar.id);
      }
      mainChar.values.forEach(v => {
        const row = charRows.find(r => r.charId === mainChar.id && r.valueId === v.id);
        const groupEntries = entries.filter(({ entry }) => entry.charValues && entry.charValues[mainChar.id] === v.id);
        html += renderV2CharGroup(key, 'v2g-' + key + '::' + mainChar.id + '::' + v.id, row, groupEntries, mainChar.id);
      });
    } else {
      html += `<div class="field">
        <label class="field-label">Objectif</label>
        <input type="number" min="0" data-v2-target="${key}" value="${target}">
      </div>
      ${reservedBadgeHtml(sizeId, categoryId, null, null)}
      ${entries.length ? entries.map(({lot, entry}) => renderV2EntryRow(lot, entry)).join('') : `<p style="color:var(--muted); font-size:12.5px; margin:0;">Aucun article ajouté pour l’instant.</p>`}`;
    }
    html += `<button type="button" class="text-btn danger" data-v2-delete-pair="${key}" style="margin-top:10px;">${icon('trash','icon-sm')} Supprimer "${escapeHtml(label)}" de cette ${list.sizeLabel.toLowerCase()}</button>`;
    html += `</div>`;
  }
  return html;
}

function v2DeletePairGrouping(sizeId, categoryId){
  const list = activeV2List();
  list.targets = (list.targets || []).filter(t => !(t.sizeId === sizeId && t.categoryId === categoryId));
  (list.lots || []).forEach(lot => {
    lot.entries = (lot.entries || []).map(e => {
      if(e.categoryId !== categoryId || !(e.sizeIds || []).includes(sizeId)) return e;
      return Object.assign({}, e, { sizeIds: e.sizeIds.filter(id => id !== sizeId) });
    }).filter(e => e.categoryId !== categoryId || (e.sizeIds || []).length > 0);
  });
  list.lots = (list.lots || []).filter(lot => {
    if((lot.entries || []).length === 0){
      (lot.photos || []).forEach(deletePhotoRef);
      return false;
    }
    return true;
  });
}

function isV2CharGroupCollapsed(groupKey, hasEntries){
  const explicit = ui.collapsedSections[groupKey];
  if(explicit === true || explicit === false) return explicit;
  return !hasEntries; // par défaut : replié si vide, déplié dès qu'il y a au moins un article
}

function renderV2CharGroup(pairKey, groupKey, row, groupEntries, excludeCharId){
  const collapsed = isV2CharGroupCollapsed(groupKey, groupEntries.length > 0);
  const [sizeId, categoryId] = pairKey.split('::');
  const inputAttrs = row.charId
    ? `data-v2-char-target="${pairKey}" data-char-id="${row.charId}" data-value-id="${row.valueId}"`
    : `data-v2-target="${pairKey}"`;
  return `<div class="v2-char-group">
    <div class="v2-group-heading-toggle ${collapsed ? '' : 'open'}" data-v2-chargroup-toggle="${groupKey}">
      <span class="v2-group-label">${escapeHtml(row.label)}${groupEntries.length ? ` <span class="v2-group-count">(${groupEntries.length})</span>` : ''}</span>
      <span class="v2-group-target" onclick="event.stopPropagation()">
        <span class="v2-group-acquired">${row.acquired} /</span>
        <input type="number" min="0" class="v2-char-target-input v2-group-target-input" ${inputAttrs} value="${row.target}">
      </span>
      <span class="chev">${icon('chevronDown','icon-sm')}</span>
    </div>
    ${reservedBadgeHtml(sizeId, categoryId, row.charId, row.valueId)}
    <div class="v2-char-group-body ${collapsed ? '' : 'open'}">
      ${groupEntries.length ? groupEntries.map(({ lot, entry }) => renderV2EntryRow(lot, entry, excludeCharId)).join('') : `<p style="color:var(--muted); font-size:12px; margin:2px 0 0;">Aucun article ajouté pour l’instant.</p>`}
    </div>
  </div>`;
}

function v2EntryCharTags(entry){
  const tags = [];
  v2CharacteristicsForCategory(entry.categoryId).forEach(ch => {
    const valId = entry.charValues && entry.charValues[ch.id];
    if(!valId) return;
    const val = ch.values.find(v => v.id === valId);
    if(val) tags.push({ charId: ch.id, label: val.label });
  });
  return tags;
}

function renderV2EntryRow(lot, entry, excludeCharId){
  const brand = v2BrandLabel(entry.brandId);
  const tags = v2EntryCharTags(entry).filter(t => t.charId !== excludeCharId);
  return `<div class="unit-row" data-v2-entry-row="${entry.id}">
    <div class="unit-photos">
      ${(lot.photos && lot.photos[0]) ? `
        <div class="unit-photo-thumb"><img data-photo-src="${lot.photos[0]}" data-v2-zoom-lot="${lot.id}"></div>
      ` : ''}
    </div>
    ${tags.length ? `<div class="v2-entry-tags-inline">${tags.map(t => `<span class="v2-tag">${escapeHtml(t.label)}</span>`).join('')}</div>` : ''}
    <div style="flex:1; font-size:12.5px; color:var(--ink); min-width:0;">
      <div>${brand ? escapeHtml(brand) + ' · ' : ''}Qté ${entry.qty}</div>
    </div>
    <button class="text-btn danger" data-v2-del-entry="${entry.id}" data-v2-lot="${lot.id}" aria-label="Supprimer">${icon('x','icon-sm')}</button>
  </div>`;
}

function bindListsV2Events(photoRefs){

  document.querySelectorAll('[data-v2-quickadd-size]').forEach(row => {

      if(!select.value){ showToast('Choisissez une catégorie'); return; }

      else activeV2List().targets.push({ sizeId, categoryId, target: val });
      save(); render();
    };
  });

  document.querySelectorAll('[data-v2-quickadd-cat]').forEach(row => {
    const categoryId = row.dataset.v2QuickaddCat;
    row.querySelector('.v2-quickadd-btn').onclick = () => {
      const select = row.querySelector('.v2-quickadd-select');
      const targetInput = row.querySelector('.v2-quickadd-target');
      if(!select.value){ showToast('Choisissez une taille'); return; }
      const sizeId = select.value;
      const val = clamp(parseInt(targetInput.value, 10) || 0, 0, 999);
      if(!Array.isArray(activeV2List().targets)) activeV2List().targets = [];
      let t = activeV2List().targets.find(t => t.sizeId === sizeId && t.categoryId === categoryId && !t.charId);
      if(t) t.target = val;
      else activeV2List().targets.push({ sizeId, categoryId, target: val });

  };

  if(photoRefs && photoRefs.length){
    document.querySelectorAll('[data-v2-edit-photo]').forEach(btn => {
